<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Рисунок 9.1. Когнитивные процессы и депрессия</title><desc id="desc">Депрессия двусторонне связана с когнитивным контролем, когнитивными искажениями и когнитивной регуляцией эмоций. Контроль направлен к двум нижним процессам, которые также двусторонне связаны.</desc>
