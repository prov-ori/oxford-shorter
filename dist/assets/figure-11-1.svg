<path d="M120 480 H785" stroke="#8b9994" stroke-width="1.5" stroke-dasharray="8 8"/>
<g fill="#d4e9de" stroke="#53685e" stroke-width="1.3">
<path d="M140 145 C117 120 160 233 191 303 C222 378 249 417 259 405 C270 386 218 283 188 222 C166 177 147 148 140 145 Z"/>
<path d="M217 101 C177 90 216 238 269 305 C301 348 341 375 346 335 C350 293 320 214 288 159 C260 114 233 98 217 101 Z"/>
<ellipse cx="704" cy="467" rx="60" ry="9"/>
</g>
<g font-size="17"><text x="156" y="345">Редкие</text><text x="156" y="367">варианты</text><text x="326" y="203">CNV</text><text x="683" y="448">SNP</text></g>
<g font-size="16" text-anchor="end">
<text x="109" y="95">100</text><text x="109" y="155">50</text><text x="109" y="232">20</text><text x="109" y="291">10</text><text x="109" y="350">5</text><text x="109" y="427">2</text><text x="109" y="486">1</text>
</g>
<g stroke="#4b5f59"><path d="M112 90 H120 M112 149 H120 M112 226 H120 M112 285 H120 M112 344 H120 M112 421 H120 M112 480 H120"/>
<path d="M158 510 V518 M281 510 V518 M406 510 V518 M531 510 V518 M618 510 V518 M656 510 V518 M695 510 V518 M745 510 V518"/></g>
<g font-size="16" text-anchor="middle"><text x="158" y="542">1 × 10⁻⁵</text><text x="281" y="542">0,0001</text><text x="406" y="542">0,001</text><text x="531" y="542">0,01</text><text x="618" y="542">0,05</text><text x="656" y="565">0,1</text><text x="695" y="542">0,2</text><text x="745" y="565">0,5</text></g>
<text x="450" y="594" font-size="19" text-anchor="middle">Частота в популяции (логарифмическая шкала)</text>
<text x="38" y="287" font-size="19" text-anchor="middle" transform="rotate(-90 38 287)">Отношение шансов шизофрении</text>
<text x="115" y="625" font-size="15">Качественная схема: приблизительная перерисовка, а не индивидуальный прогноз.</text>
</g></svg>

