<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" role="img" aria-labelledby="title desc">
<title id="title">Аллельный спектр шизофрении</title><desc id="desc">Качественная схема с логарифмическими осями. Редкие варианты и CNV расположены в области малой частоты и большого эффекта, SNP — большой частоты и малого эффекта. Области перерисованы приблизительно.</desc>
<rect width="860" height="640" fill="white"/>
<g font-family="Arial,sans-serif" fill="#183b32">
