<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" role="img" aria-labelledby="title desc"><title id="title">Рисунок 6.1. Клинический ответ при фиксированной и повышаемой дозе антидепрессантов</title><desc id="desc">Русскоязычное воспроизведение значений рисунка на PDF135. Объединённая оценка СИОЗС 0,96, доверительный интервал 0,74–1,25. Строка венлафаксина в исходнике напечатана как 124, хотя точка графика соответствует 1,24. Размеры маркеров приближены к печатному рисунку; численные веса источник не сообщает.</desc><rect width="1060" height="640" fill="white"/><g font-family="Arial,sans-serif" font-size="18" fill="#233c35"><text x="25" y="35" font-weight="bold">Препарат</text><text x="540" y="35" font-weight="bold">ROR</text><text x="790" y="35" font-weight="bold">ROR [95% ДИ]</text><text x="25" y="88" font-weight="bold">СИОЗС</text><path d="M565 65V525M390 525H740" stroke="#69756d" fill="none"/><text x="25" y="131">Циталопрам</text><text x="790" y="131">0,96 [0,74; 1,26]</text><path d="M488.9795057744894 125H623.3491534019086" stroke="#4e5853"/><rect x="551.1936044156255" y="121.5" width="7" height="7" fill="#5877ba"/><text x="25" y="168">Эсциталопрам</text><text x="790" y="168">0,97 [0,79; 1,19]</text><path d="M505.48679772041623 162H608.9182753683133" stroke="#4e5853"/><rect x="553.8099141721705" y="158.5" width="7" height="7" fill="#5877ba"/><text x="25" y="205">Флуоксетин</text><text x="790" y="205">1,39 [0,97; 1,98]</text><path d="M557.3099141721705 199H737.4625753033549" stroke="#4e5853"/><rect x="645.139854516037" y="196" width="6" height="6" fill="#5877ba"/><text x="25" y="242">Пароксетин</text><text x="790" y="242">0,98 [0,81; 1,19]</text><path d="M511.7989172942325 236H608.9182753683133" stroke="#4e5853"/><rect x="556.3993895095846" y="232.5" width="7" height="7" fill="#5877ba"/><text x="25" y="279">Сертралин</text><text x="790" y="279">0,72 [0,57; 0,91]</text><path d="M423.08091926825296 273H541.189228824195" stroke="#4e5853"/><rect x="478.06204204182785" y="269" width="8" height="8" fill="#5877ba"/><text x="25" y="316" font-weight="bold">Модель случайных эффектов</text><text x="790" y="316" font-weight="bold">0,96 [0,74; 1,25]</text><path d="M488.9795057744894 310L554.6936044156255 301L621.3374166052884 310L554.6936044156255 319Z" fill="#d86677" stroke="#374b43"/><text x="25" y="416">Венлафаксин</text><text x="790" y="416">124 [0,96; 1,60]*</text><path d="M554.6936044156255 410H683.6625833947116" stroke="#4e5853"/><rect x="611.8095211071263" y="402.5" width="15" height="15" fill="#5877ba"/><text x="25" y="491">Миртазапин</text><text x="790" y="491">0,77 [0,33; 1,78]</text><path d="M390 485H710.5785172085427" stroke="#4e5853"/><rect x="491.01281141103095" y="477" width="16" height="16" fill="#5877ba"/><path d="M400 479L390 485L400 491" stroke="#4e5853" fill="none"/><text x="25" y="350" font-size="16">Гетерогенность: I² = 60%; τ² = 0,0236; p = 0,04</text><path d="M390 525v8" stroke="#69756d"/><text x="390" y="555" text-anchor="middle">0,5</text><path d="M565 525v8" stroke="#69756d"/><text x="565" y="555" text-anchor="middle">1</text><path d="M740 525v8" stroke="#69756d"/><text x="740" y="555" text-anchor="middle">2</text><text x="375" y="585" text-anchor="middle" font-size="15">В пользу фиксированной низкой дозы</text><text x="745" y="585" text-anchor="middle" font-size="15">В пользу гибко повышаемой дозы</text><text x="25" y="620" font-size="14">* «124» — напечатанное значение оригинала; положение точки воспроизведено как 1,24.</text></g></svg>