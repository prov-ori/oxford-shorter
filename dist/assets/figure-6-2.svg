<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -8 1792 1086" role="img" aria-labelledby="title description">
<title id="title">Рисунок 6.2. Сеть сравнений методов лечения острой мании</title>
<desc id="description">Четырнадцать узлов и тридцать три прямых сравнения, воспроизведённые по рисунку 6.2 предоставленного учебника. Узлы: азенапин, карбамазепин, рисперидон, кветиапин, вальпроат, топирамат, зипрасидон, оланзапин, галоперидол, ламотриджин, литий, габапентин, плацебо и арипипразол. Положение и относительные размеры узлов, а также относительная толщина линий измерены по исходному растру. В оригинале толщина линий пропорциональна числу испытаний для каждой пары методов лечения, размер узлов — числу рандомизированных участников. Численные значения этих показателей в рисунке не приведены.</desc>
<metadata>Source: v4o9kdwe8i3gfuy.pdf, PDF page 136, printed page 127, Figure 6.2; native embedded raster 1748 by 1061 pixels. Coordinates and radii measured from the source, 33 edges verified against all 91 node pairs. Russian labels replace English labels. Geometric tracing; not a recovery of trial counts or participant counts.</metadata>
