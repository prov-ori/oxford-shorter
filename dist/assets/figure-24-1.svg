<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1540" role="img" aria-labelledby="title desc"><title id="title">Рисунок24.1. Условные обозначения генограммы</title><desc id="desc">Русская перерисовка рисунка PDF689: пол, возраст, пациент, брак, разлука и развод, повторный брак, сожительство, смерть, дети, усыновление, мертворождение, состав двух домохозяйств и четыре вида отношений. Сохраняются числа и связи примеров исходника. Текстовая легенда размещена рядом на странице учебника.</desc><rect width="560" height="1540" fill="white"/><g stroke="#303c36" stroke-width="1.3" fill="none"><text x="20" y="32" font-size="23" text-anchor="start">Рисунок 24.1. Обозначения генограммы</text><text x="20" y="62" font-size="16" text-anchor="start">Возраст — число внутри символа; даты — рядом со связью.</text><rect x="32" y="91" width="26" height="26"/><text x="45" y="110" font-size="16" text-anchor="middle">45</text><text x="74" y="110" font-size="18" text-anchor="start">Мужчина</text><circle cx="280" cy="104" r="13"/><text x="280" y="110" font-size="16" text-anchor="middle">39</text><text x="308" y="110" font-size="18" text-anchor="start">Женщина</text><rect x="32" y="152" width="26" height="26"/><rect x="26" y="146" width="38" height="38"/><circle cx="110" cy="165" r="13"/><circle cx="110" cy="165" r="19"/><text x="153" y="171" font-size="18" text-anchor="start">Пациент (двойной контур)</text><rect x="32" y="217" width="26" height="26"/><circle cx="175" cy="230" r="13"/><path d="M45 243L45 265" /><path d="M45 265L175 265" /><path d="M175 243L175 265" /><text x="100" y="259" font-size="16" text-anchor="middle">брак 1948</text><text x="220" y="250" font-size="18" text-anchor="start">Брак</text><rect x="32" y="312" width="26" height="26"/><circle cx="175" cy="325" r="13"/><path d="M45 338L45 360" /><path d="M45 360L175 360" /><path d="M175 338L175 360" /><path d="M101 368L109 352" /><path d="M109 368L117 352" /><text x="45" y="397" font-size="16" text-anchor="start">Разде