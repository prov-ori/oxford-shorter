<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1160" role="img" aria-labelledby="title"><title id="title">Рисунок 18.1. Краткосрочное ведение нарушенного или насильственного поведения</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#257653"/></marker></defs><rect width="1100" height="1160" fill="white"/><g font-family="Arial,sans-serif" fill="#183b2b"><text x="30" y="35" font-size="24" text-anchor="start"><tspan x="30" dy="0">Рисунок 18.1. Алгоритм из учебника (источник NICE, 2015)</tspan></text><rect x="400" y="65" width="300" height="115" fill="#d9e9df" stroke="#40584b"/><text x="550" y="95" font-size="19" text-anchor="middle"><tspan x="550" dy="0">ПРОГНОЗИРОВАНИЕ</tspan><tspan x="550" dy="25.650000000000002">Оценка риска</tspan><tspan x="550" dy="25.650000000000002">Досмотр</tspan></text><path d="M550 180V220" fill="none" stroke="#257653" stroke-width="2" marker-end="url(#a)" /><rect x="400" y="220" width="300" height="110" fill="#d9e9df" stroke="#40584b"/><text x="550" y="250" font-size="19" text-anchor="middle"><tspan x="550" dy="0">ПРОФИЛАКТИКА</tspan><tspan x="550" dy="25.650000000000002">Деэскалация</tspan><tspan x="550" dy="25.650000000000002">Наблюдение</tspan></text><rect x="790" y="185" width="275" height="155" fill="#d9e9df" stroke="#40584b"/><text x="927" y="215" font-size="18" text-anchor="middle"><tspan x="927" dy="0">НЕОТЛОЖНАЯ ПОМОЩЬ</tspan><tspan x="927" dy="24.3">Запросить экспертную</tspan><tspan x="927" dy="24.3">помощь у сотрудника</tspan><tspan x="927" dy="24.3">дежурной команды</tspan><tspan x="927" dy="24.3">психического здоровья</tspan></text><path d="M550 330V380" fill="none" stroke="#257653" stroke-width="2" marker-end="url(#a)" /><rect x="160" y="380" width="900" height="620" fill="#d9e9df" stroke="#40584b"/><text x="610" y="410" font-size="18" text-anchor="middle"><tspan x="610" dy="0">ВМЕШАТЕЛЬСТВА ДЛЯ ПРОДОЛЖЕНИЯ ВЕДЕНИЯ</tspan><tspan x="610" dy="24.3">В дополнение к предыдущим мерам рассмотреть один или несколько вариантов</tspan></text><rect x="175" y="460" width="290" height="480" fill="#d9e9df" stroke="#40584b"/><rect x="465" y="460" width="290" height="480" fill="#d9e9df" stroke="#40584b"/><rect x="755" y="460" width="290" height="480" fill="#d9e9df" stroke="#40584b"/><text x="190" y="490" font-size="19" text-anchor="start"><tspan x="190" dy="0">Быстрая транквилизация</tspan></text><text x="480" y="490" font-size="19" text-anchor="start"><tspan x="480" dy="0">Изоляция</tspan></text><text x="770" y="490" font-size="19" text-anchor="start"><tspan x="770" dy="0">Физическое вмешательство</tspan></text><text x="190" y="530" font-size="18" text-anchor="start"><tspan x="190" dy="0">Чтобы избежать длительного</tspan><tspan x="190" dy="24.3">физического вмешательства.</tspan><tspan x="190" dy="24.3">Лекарство необходимо для</tspan><tspan x="190" dy="24.3">успокоения пациента с</tspan><tspan x="190" dy="24.3">психотическим или</tspan><tspan x="190" dy="24.3">непсихотическим нарушенным</tspan><tspan x="190" dy="24.3">поведением.</tspan></text><text x="480" y="530" font-size="18" text-anchor="start"><tspan x="480" dy="0">Чтобы избежать длительного</tspan><tspan x="480" dy="24.3">физического вмешательства.</tspan></text><text x="770" y="530" font-size="18" text-anchor="start"><tspan x="770" dy="0">Предпочтительнее, если</tspan><tspan x="770" dy="24.3">пациент быстро реагирует.</tspan><tspan x="770" dy="24.3">Можно применять, чтобы</tspan><tspan x="770" dy="24.3">дать подействовать быстрой</tspan><tspan x="770" dy="24.3">транквилизации.</tspan></text><path d="M175 725H1045M175 775H1045" stroke="#40584b"/><text x="610" y="754" font-size="18" text-anchor="middle"><tspan x="610" dy="0">ПРОТИВОПОКАЗАНО КАК ВМЕШАТЕЛЬСТВО</tspan></text><text x="190" y="815" font-size="18" text-anchor="start"><tspan x="190" dy="0">Когда пациент уже</tspan><tspan x="190" dy="24.3">принял лекарство.</tspan></text><text x="480" y="815" font-size="17" text-anchor="start"><tspan x="480" dy="0">Следует прекратить, когда</tspan><tspan x="480" dy="22.950000000000003">быстрая транквилизация,</tspan><tspan x="480" dy="22.950000000000003">если применена, подействовала.</tspan><tspan x="480" dy="22.950000000000003">Когда другие вмешательства</tspan><tspan x="480" dy="22.950000000000003">ещё не были рассмотрены.</tspan></text><text x="770" y="815" font-size="18" text-anchor="start"><tspan x="770" dy="0">Длительное физическое</tspan><tspan x="770" dy="24.3">вмешательство.</tspan></text><path d="M550 1000V1040" fill="none" stroke="#257653" stroke-width="2" marker-end="url(#a)" /><rect x="380" y="1040" width="340" height="70" fill="#d9e9df" stroke="#40584b"/><text x="550" y="1082" font-size="18" text-anchor="middle"><tspan x="550" dy="0">РАЗБОР ПОСЛЕ ПРОИСШЕСТВИЯ</tspan></text><path d="M90 100V1090" fill="none" stroke="#257653" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><text transform="rotate(-90 55 590)" x="55" y="590" font-size="18" text-anchor="middle"><tspan x="55" dy="0">Непрерывная оценка риска и использование деэскалации</tspan></text></g></svg>