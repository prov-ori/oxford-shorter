<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 555" role="img" aria-labelledby="title desc"><title id="title">Рисунок25.1. ЭСТ против имитации при депрессии</title><desc id="desc">Шесть испытаний и два объединённых эффекта. Отрицательные значения в пользу ЭСТ. Все точные значения доступны в таблице под рисунком.</desc><rect width="850" height="555" fill="#fff"/><g font-family="Arial,sans-serif" fill="#173e43"><text x="20" y="34" font-size="23">ЭСТ против имитации: метаанализ</text><text x="20" y="65" font-size="17">Стандартизированный размер эффекта и 95% доверительный интервал</text><path d="M665 88V450" stroke="#567" stroke-dasharray="5 4"/><text x="20" y="118" font-size="17">Wilson 1963</text><path d="M333.09499999999997 112H684.2850000000001M333.09499999999997 104V120M684.2850000000001 104V120" stroke="#48716a" fill="none" stroke-width="2"/><rect x="503.69" y="107" width="10" height="10" fill="#009c70" transform="rotate(45 508.69 112)"/><text x="20" y="162" font-size="17">West 1981</text><path d="M350.35 156H615.555M350.35 148V164M615.555 148V164" stroke="#48716a" fill="none" stroke-width="2"/><rect x="478.025" y="151" width="10" height="10" fill="#009c70" transform="rotate(45 483.025 156)"/><text x="20" y="206" font-size="17">Lambourn 1978</text><path d="M528.7 200H752M528.7 192V208M752 192V208" stroke="#48716a" fill="none" stroke-width="2"/><rect x="635.35" y="195" width="10" height="10" fill="#009c70" transform="rotate(45 640.35 200)"/><text x="20" y="250" font-size="17">Freeman 1978</text><path d="M481.61850000000004 244H665.8699999999999M481.61850000000004 236V252M665.8699999999999 236V252" stroke="#48716a" fill="none" stroke-width="2"/><rect x="568.7950000000001" y="239" width="10" height="10" fill="#009c70" transform="rotate(45 573.7950000000001 244)"/><text x="20" y="294" font-size="17">Gregory 1985</text><path d="M373.26 288H545.52M373.26 280V296M545.52 280V296" stroke="#48716a" fill="none" stroke-width="2"/><rect x="454.39" y="283" width="10" height="10" fill="#009c70" transform="rotate(45 459.39 288)"/><text x="20" y="338" font-size="17">Johnstone 1980</text><path d="M483.31500000000005 332H632.52M483.31500000000005 324V340M632.52 324V340" stroke="#48716a" fill="none" stroke-width="2"/><rect x="552.845" y="327" width="10" height="10" fill="#009c70" transform="rotate(45 557.845 332)"/><text x="20" y="382" font-size="17">Фиксированная модель</text><path d="M493.90000000000003 376H571.475M493.90000000000003 368V384M571.475 368V384" stroke="#48716a" fill="none" stroke-width="2"/><path d="M493.90000000000003 376L532.905 366L571.475 376L532.905 386Z" fill="#e1f5ed" stroke="#009c70"/><text x="20" y="426" font-size="17">Случайные эффекты</text><path d="M480.85 420H587.135M480.85 412V428M587.135 412V428" stroke="#48716a" fill="none" stroke-width="2"/><path d="M480.85 420L533.34 410L587.135 420L533.34 430Z" fill="#e1f5ed" stroke="#009c70"/><path d="M230 468H810" stroke="#567"/><path d="M230 468V475" stroke="#567"/><text x="230" y="496" font-size="17" text-anchor="middle">-3</text><path d="M375 468V475" stroke="#567"/><text x="375" y="496" font-size="17" text-anchor="middle">-2</text><path d="M520 468V475" stroke="#567"/><text x="520" y="496" font-size="17" text-anchor="middle">-1</text><path d="M665 468V475" stroke="#567"/><text x="665" y="496" font-size="17" text-anchor="middle">0</text><path d="M810 468V475" stroke="#567"/><text x="810" y="496" font-size="17" text-anchor="middle">1</text><text x="390" y="529" font-size="18" text-anchor="middle">В пользу ЭСТ</text><text x="740" y="529" font-size="18" text-anchor="middle">В пользу имитации</text></g></svg>