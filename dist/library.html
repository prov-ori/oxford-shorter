{t:"Fish's Clinical Psychopathology",a:"Casey, Kelly, 5-е изд.",cat:"psy",status:"later",badge:"Медвуз, приоритет №2",
toc:"1. Введение в описательную психопатологию и метод. 2. Расстройства восприятия: иллюзии, истинные галлюцинации, псевдогаллюцинации (по модальностям: слуховые, зрительные, тактильные, обонятельные). 3. Расстройства мышления по форме: ускорение/замедление, разорванность, персеверация, неологизмы. 4. Расстройства мышления по содержанию: бред (типы — преследования, величия, ревности, воздействия), сверхценные идеи, навязчивости. 5. Расстройства речи и языка. 6. Расстройства аффекта: депрессивный, маниакальный, тревожный, уплощённый, неадекватный аффект. 7. Расстройства влечений и психомоторики: кататония, ступор, возбуждение. 8. Расстройства сознания: оглушение, делирий, сумеречное состояние. 9. Расстройства памяти и ориентировки: амнезии, конфабуляции. 10. Расстройства самосознания (деперсонализация/дереализация). 11. Синдромология: как симптомы складываются в синдромы.",

{t:"Основы психофармакологии (Essential Psychopharmacology)",a:"Стивен Стал",cat:"psy",status:"later",badge:"Медвуз, приоритет №3",
toc:"1. Химические посредники: нейротрансмиттеры, рецепторы, сигнальные каскады, G-белки. 2. Синапс и принципы нейропередачи. 3. Антидепрессанты: SSRI, SNRI, трициклики, MAOI, атипичные — механизмы и различия. 4. Антипсихотики: типичные vs атипичные, D2-блокада, серотонин-дофаминовая гипотеза шизофрении. 5. Стабилизаторы настроения: литий, вальпроаты, ламотриджин — механизмы при биполярном расстройстве. 6. Анксиолитики: бензодиазепины, буспирон, GABA-система. 7. Снотворные и хронобиология сна. 8. Психостимуляторы и лечение СДВГ. 9. Психофармакология деменции. 10. Особые популяции: беременность, пожилой возраст, дети. 11. Фармакогенетика и персонализированная психофармакология.",
why:"Не таблицы дозировок (это Prescriber's Guide), а именно механизмы — почему конкретный препарат работает на нейрохимическом уровне.",
give:"Oxford скажет 'при депрессии используют SSRI'. Stahl объяснит, почему именно SSRI и что происходит в синапсе."},

{t:"Психиатрия и медицинская психология",a:"Иванец, Тюльпин, Кинкулькина",cat:"psy",status:"skip",badge:"Дублирует Oxford",
toc:"1. Общая психопатология: расстройства ощущений, восприятия, памяти, мышления, эмоций, воли, сознания. 2. Методы обследования психиатрического больного. 3. Шизофрения и расстройства шизофренического спектра. 4. Аффективные расстройства (депрессия, мания, биполярное). 5. Невротические, связанные со стрессом расстройства (неврозы, ПТСР, ОКР). 6. Расстройства личности (психопатии). 7. Умственная отсталость. 8. Органические психические расстройства (деменции, экзогенно-органические психозы). 9. Эпилепсия и психические нарушения при ней. 10. Наркология: алкоголизм, наркомании, токсикомании. 11. Детская и подростковая психиатрия. 12. Судебная психиатрия и вопросы дееспособности. 13. Основы медицинской психологии: психология больного, деонтология, психосоматика. 14. Организация психиатрической помощи в РФ, законодательство.",
why:"Российский учебник, построен под российскую номенклатуру и организацию здравоохранения, местами расходится с ICD-11 и европейской практикой.",
give:"Дублирует функцию Oxford, но под другую систему здравоохранения, которая не твоя. Не приоритет — Oxford для твоего контекста ценнее."},

{t:"Клиническое интервью (Clinical Interviewing)",a:"John & Rita Sommers-Flanagan",cat:"psy",status:"later",badge:"Горизонт резидентуры",
toc:"1. Основы и этика клинического интервью. 2. Слушание и построение раппорта. 3. Невербальная коммуникация в интервью. 4. Структура интервью: открытие, основная часть, завершение. 5. Техники опроса: открытые/закрытые вопросы, отражение, прояснение. 6. Оценка психического статуса (Mental Status Exam). 7. Сбор анамнеза: история болезни, семейный анамнез, социальный анамнез. 8. Оценка суицидального риска и риска насилия. 9. Работа с сопротивлением и трудными клиентами. 10. Интервью с детьми и подростками. 11. Интервью с парами и семьями. 12. Мультикультурная компетентность в интервью. 13. Особые популяции: пожилые, люди с ограниченными возможностями. 14. Постановка диагноза и написание заключения.",

{t:"Blumenfeld — Neuroanatomy Through Clinical Cases",a:"Stephen Blumenfeld",cat:"neuro",status:"later",badge:"Медвуз, уникальный контент",
toc:"1. Введение: подход через клинические случаи. 2. Обзор нейроанатомии и нейровизуализации. 3. Спинной мозг и его синдромы. 4. Ствол мозга: черепные нервы, синдромы ствола. 5. Мозжечок и нарушения координации. 6. Таламус и базальные ганглии (болезнь Паркинсона). 7. Зрительная система и её поражения. 8. Слуховая и вестибулярная системы. 9. Кора больших полушарий: лобная, теменная, височная, затылочная доли и их синдромы. 10. Речь и афазии (Брока, Вернике). 11. Лимбическая система и память (гиппокамп, амнезии). 12. Сосудистая система мозга и инсульты по бассейнам. 13. Вегетативная нервная система. 14. Высшие когнитивные функции и их нарушения.",

{t:"Основы общей психологии",a:"Сергей Рубинштейн",cat:"psych-gen",status:"later",badge:"Трек Б, дублирует",
toc:"1. Предмет психологии и её задачи. 2. Методы психологии. 3. История развития психологии как науки. 4. Развитие психики в филогенезе. 5. Развитие поведения и психики животных. 6. Проблема сознания. 7. Деятельность (структура, виды). 8. Ощущение. 9. Восприятие (свойства, виды, восприятие пространства/времени/движения). 10. Память (виды, процессы запоминания, забывание). 11. Воображение. 12. Мышление и речь. 13. Внимание. 14. Эмоции и чувства. 15. Воля. 16. Темперамент и характер. 17. Способности. 18. Личность: направленность, самосознание.",

{t:"Лекции по общей психологии",a:"А.Р. Лурия",cat:"psych-gen",status:"later",badge:"Трек Б, пара с Выготским",
toc:"1. Предмет психологии, её место среди наук. 2. Психология и мозг: проблема локализации функций. 3. Ощущения: виды, законы психофизики. 4. Восприятие: константность, предметность, категориальность. 5. Внимание: непроизвольное и произвольное, нейрофизиология внимания. 6. Память: виды, процессы, нарушения памяти. 7. Эмоции: физиологические основы, теории эмоций. 8. Речь и мышление: развитие понятий, внутренняя речь. 9. Движения и действия: произвольная регуляция. 10. Личность: культурно-историческая концепция развития.",

{t:"Психология развития",a:"Грэйс Крайг, Дон Бокум, 9-е изд.",cat:"psych-gen",status:"later",badge:"Трек Б, закрывает реальный пробел",
toc:"1. Основы теории развития (Пиаже, Эриксон, Выготский, этология). 2. Наследственность и пренатальное развитие. 3. Рождение и период новорождённости. 4. Физическое и когнитивное развитие в младенчестве. 5. Психосоциальное развитие младенца (привязанность). 6. Раннее детство: физическое, когнитивное, психосоциальное развитие. 7. Среднее детство (школьный возраст): развитие интеллекта, Я-концепции, отношения со сверстниками. 8. Подростковый возраст: пубертат, идентичность, отношения с родителями. 9. Ранняя взрослость: карьера, близкие отношения. 10. Средняя взрослость: кризис среднего возраста, семья. 11. Поздняя взрослость: старение, когнитивные изменения. 12. Смерть, умирание и утрата.",

give:"Критично для будущей практики: отличать возрастную норму от патологии, понимать детскую/подростковую и гериатрическую психиатрию."},

{t:"Социальная психология",a:"Дэвид Майерс, 7-е изд.",cat:"psych-gen",status:"later",badge:"Трек Б, расширяет Чалдини",
toc:"1. Введение в социальную психологию: методы исследования. 2. Я в социальном мире: самооценка, самоэффективность, локус контроля. 3. Социальные убеждения и суждения: атрибуция, самоисполняющиеся пророчества. 4. Установки и поведение. 5. Сила ситуации: конформность, подчинение авторитету (Милгрэм), эффект свидетеля. 6. Убеждение: элементы, маршруты убеждения. 7. Групповое влияние: социальная фасилитация, огруппление мышления, деиндивидуация. 8. Предрассудки: природа, причины, последствия. 9. Агрессия: теории, влияющие факторы. 10. Привлекательность и близкие отношения: любовь, привязанность. 11. Просоциальное поведение (альтруизм). 12. Конфликт и примирение.",

{t:"Основы нейропсихологии",a:"А.Р. Лурия",cat:"neuro",status:"now",badge:"Можно читать уже сейчас",
toc:"1. Мозг как субстрат психической деятельности — три функциональных блока мозга (по Лурии). 2. Проблема локализации высших психических функций. 3. Нарушения при поражении затылочных отделов (зрительные агнозии). 4. Нарушения при поражении теменных отделов (соматосенсорные расстройства, апраксии). 5. Нарушения при поражении височных отделов (слуховые агнозии, афазии — сенсорная, акустико-мнестическая). 6. Нарушения при поражении лобных долей (регуляция поведения, лобный синдром, персеверации). 7. Нарушения памяти при разных локализациях. 8. Методы нейропсихологической диагностики (батарея Лурии).",

give:"Прямое попадание в твой интерес к нейропсихиатрии. Не требует медицинской базы, можно читать уже сейчас."},

{t:"Психология стресса (Why Zebras Don't Get Ulcers)",a:"Роберт Сапольски",cat:"popsci",status:"now",badge:"Можно читать уже сейчас",
toc:"1. Что такое стресс: эволюционная логика реакции 'бей или беги'. 2. Стресс и сердечно-сосудистая система (гипертония, атеросклероз). 3. Стресс и энергетический метаболизм. 4. Стресс, пищеварение и язвы. 5. Стресс и рост (влияние на детей). 6. Стресс и иммунная система. 7. Стресс, боль и память. 8. Стресс и сон. 9. Стресс и старение. 10. Стресс и депрессия — ось HPA и кортизол. 11. Личность, характер и уязвимость к стрессу. 12. Социальный статус и стресс (иерархии). 13. Управление стрессом: что реально работает.",
why:"Прямая биологическая база, которая напрямую пересекается с психиатрией (депрессия, тревожные расстройства, ПТСР).",
give:"Понимание механизма, который будешь снова видеть в физиологии и психиатрии — не изолированный научпоп, а реальный фундамент."},

{t:"Теории личности",a:"Ларри Хьелл, Дэниел Зиглер",cat:"psych-gen",status:"later",badge:"Трек Б",
toc:"1. Введение: что такое теория личности, критерии оценки теорий. 2. Психодинамическое направление: Фрейд (структура личности, психосексуальные стадии, защитные механизмы). 3. Аналитическая психология Юнга: архетипы, коллективное бессознательное. 4. Индивидуальная психология Адлера: комплекс неполноценности, стиль жизни. 5. Эго-психология: Эриксон, стадии психосоциального развития. 6. Диспозициональное направление: Олпорт (черты личности), Кеттелл (факторный анализ), Айзенк (типы). 7. Бихевиористское направление: Скиннер, оперантное обусловливание. 8. Теория социального научения: Бандура, самоэффективность. 9. Когнитивное направление: Келли, теория личностных конструктов. 10. Гуманистическое направление: Маслоу (иерархия потребностей, самоактуализация), Роджерс (Я-концепция, клиент-центрированный подход). 11. Экзистенциальная психология: Мэй, Франкл. 12. Сравнение теорий и практическое применение.",
why:"Сравнительный обзор основных теоретических рамок понимания личности.",
give:"База для будущего психотерапевтического образования — понимание, из какой теории растёт каждая терапевтическая школа."},

{t:"Когнитивная психология",a:"Роберт Солсо",cat:"psych-gen",status:"later",badge:"Трек Б",
toc:"1. Введение и история когнитивной психологии. 2. Нейрокогнитивные основы познания. 3. Восприятие: теории распознавания образов. 4. Внимание: селективное внимание, модели фильтрации. 5. Память: сенсорная, кратковременная, рабочая память. 6. Долговременная память: эпизодическая, семантическая, процедурная. 7. Забывание и искажения памяти. 8. Репрезентация знаний: понятия, категории, схемы. 9. Зрительные образы (мысленные представления). 10. Язык: понимание и порождение речи. 11. Решение задач и творческое мышление. 12. Принятие решений и рассуждение. 13. Человеческий и искусственный интеллект.",
why:"Более современный и структурированный, экспериментально обоснованный взгляд, чем классические советские учебники.",
give:"Читать после базовых вводных текстов (Гиппенрейтер) — даёт более строгую, современную картину когнитивных процессов."},

{t:"Детская психиатрия, психотерапия и медицинская психология",a:"—",cat:"psy",status:"later",badge:"Горизонт субспециализации",
toc:"1. Норма психического развития по возрастам. 2. Методы обследования ребёнка. 3. Расстройства аутистического спектра. 4. СДВГ и гиперкинетические расстройства. 5. Расстройства поведения (оппозиционно-вызывающее, кондуктное). 6. Тревожные расстройства детского возраста (сепарационная тревога, школьная фобия). 7. Депрессия у детей и подростков, суицидальность. 8. Тики и синдром Туретта. 9. Энурез и энкопрез. 10. Нарушения пищевого поведения у детей. 11. Умственная отсталость. 12. Специфические расстройства развития (речи, учебных навыков). 13. Психосоматические расстройства у детей. 14. Детская медицинская психология: реакция на болезнь, госпитализм. 15. Семейная терапия и работа с родителями. 16. Психофармакология в детском возрасте.",
why:"Узкая субспециализация детской психиатрии — отдельная область внутри психиатрии.",
give:"Полезно, только если решишь специализироваться именно на детской/подростковой психиатрии — не общий приоритет сейчас."},

{t:"Психология эмоций",a:"Пол Экман",cat:"popsci",status:"now",badge:"Можно читать когда угодно",
toc:"1. Что такое эмоция: определение, компоненты. 2. Универсальность базовых эмоций (гнев, страх, отвращение, удивление, радость, печаль) — кросс-культурные исследования. 3. Мимическое выражение эмоций: система кодирования лицевых движений (FACS). 4. Микровыражения и обнаружение скрываемых эмоций. 5. Гнев: триггеры, физиология, управление. 6. Страх и связанные состояния (тревога). 7. Отвращение и его эволюционная функция. 8. Печаль и горе. 9. Удивление как самая короткая эмоция. 10. Обман: как распознать ложь по невербальным сигналам. 11. Эмоциональная осознанность и регуляция эмоций.",
why:"Исследования базовых эмоций и их универсальных выражений на лице.",
give:"Общая эрудиция, смежная тема с эмоциональной регуляцией в психиатрии. Лёгкое чтение без предварительной базы."},

{t:"Биология добра и зла",a:"Роберт Сапольски",cat:"popsci",status:"caution",badge:"Не для тяжёлых эмоциональных периодов",
toc:"1. Введение: поведение как результат множества причинных уровней. 2. За секунду до: нейробиология поступка (миндалина, префронтальная кора). 3. За секунды-минуты до: гормоны и поведение (тестостерон, окситоцин). 4. За часы-дни до: пренатальное развитие и раннее детство. 5. За годы до: подростковый мозг и его созревание. 6. За века до: генетика поведения. 7. За тысячелетия до: эволюция сотрудничества и агрессии. 8. Культура и экология: как среда формирует моральные нормы. 9. Мы и Они: нейробиология групповой идентичности и предвзятости. 10. Иерархия, статус и стресс в социальных группах. 11. Эмпатия, альтруизм и просоциальное поведение. 12. Мораль: интуиция vs рассуждение. 13. Война и мир: биология межгруппового насилия. 14. Свобода воли и вопрос ответственности с точки зрения детерминизма. 15. Заключение: что делать с этим знанием.",
why:"Общие биологические основы поведения — агрессия, мораль, групповое поведение — через нейробиологию, эндокринологию, эволюцию.",
give:"Более общий контекст, чем 'Психология стресса', меньше прямой связи с психиатрией. Содержит тяжёлые темы (геноцид, жестокость) — не читать в эмоционально тяжёлые периоды."},

{t:"Думай медленно… Решай быстро",a:"Даниэль Канеман",cat:"popsci",status:"now",badge:"Общая эрудиция",
toc:"1. Две системы мышления: Система 1 (быстрая, интуитивная) и Система 2 (медленная, аналитическая). 2. Эвристики и предвзятости: доступность, репрезентативность, привязка (anchoring). 3. Сверхуверенность и иллюзия понимания. 4. Эвристика узнавания и субституция. 5. Теория перспектив: как люди оценивают риск и выгоду. 6. Эффект фрейминга: влияние формулировки на решение. 7. Неприятие потерь (loss aversion). 8. Эффект владения (endowment effect). 9. Ментальный учёт (mental accounting). 10. Прогнозирование и регрессия к среднему. 11. Два Я: испытывающее и помнящее (experiencing vs remembering self). 12. Счастье и благополучие с точки зрения двух систем.",
why:"Классика по когнитивным искажениям и процессу принятия решений.",
give:"Общая эрудиция, не привязана к специальности напрямую. Полезный кругозор."},

{t:"Когнитивно-поведенческая терапия",a:"Джудит Бек",cat:"psychotherapy",status:"later",badge:"Терапевтическая школа №1",
toc:"1. Введение в когнитивно-поведенческую терапию и её теоретическая база. 2. Когнитивная концептуализация случая. 3. Структура первой сессии. 4. Структура последующих сессий. 5. Активация поведения и постановка целей. 6. Выявление автоматических мыслей. 7. Выявление эмоций и их связь с мыслями. 8. Оценка и ответ на автоматические мысли (когнитивная реструктуризация). 9. Выявление промежуточных убеждений (правила, установки). 10. Изменение промежуточных убеждений. 11. Выявление и изменение глубинных (core) убеждений. 12. Дополнительные когнитивные и поведенческие техники. 13. Домашние задания в терапии. 14. Завершение терапии и профилактика рецидива. 15. Проблемы в терапии и работа с сопротивлением.",
why:"Одна из основных доказательных школ психотерапии, конкретные техники работы с искажённым мышлением.",
give:"Прикладная клиническая книга — актуальна ближе к этапу реального психотерапевтического обучения, не сейчас."},

{t:"Общая психопатология, том 1",a:"Карл Ясперс",cat:"psy",status:"caution",badge:"Пересмотрено — не приоритет",
toc:"Структура всего труда (граница между томами зависит от издания; сверь по оглавлению своих томов): Введение: предмет и методы психопатологии, феноменологический подход. Часть 1. Отдельные психические явления: субъективные переживания (феноменология: расстройства восприятия, представлений, мышления, сознания, чувств, влечений, самосознания), объективные проявления (функциональные нарушения памяти, внимания, интеллекта, психомоторики), соматические сопровождающие явления. Часть 2. Осмысленные связи психической жизни: понимающая психология, генетическое понимание, бред как непонятное. Часть 3. Причинные связи: объясняющая психология, наследственность, конституция, влияние среды и соматических болезней.",
why:"Философско-методологический труд 1913 года о том, как мыслить о психических расстройствах — не клиническое руководство.",
give:"Требует клинического опыта для полноценного усвоения. Читать после накопления базы (Sacks, Лурия, Oxford), а не как первый серьёзный текст — иначе абстракции без клинического якоря."},

{t:"Общая психопатология, том 2",a:"Карл Ясперс",cat:"psy",status:"caution",badge:"Продолжение тома 1",
toc:"Продолжение единого труда (сверь границу с оглавлением своего тома). Часть 3, продолжение: причинные связи, личность и характер, влияние социальной среды. Часть 4. Психическая жизнь как целое: систематика (классификация) психических болезней, процессы и развития личности, группы органических психозов, шизофрении, циклотимии, психопатий и неврозов. Часть 5. Ненормальная психическая жизнь в социальном и историческом аспекте: культура, история, социальные условия, роль психиатрии в обществе. Часть 6. Человек как целое: границы психопатологии, философские основания, свобода и экзистенция.",
why:"Одна книга, разбитая издательством на два тома из-за объёма.",
give:"Нужен только если читаешь том 1 — иначе владеешь половиной труда."},

{t:"Введение в общую психологию",a:"Гиппенрейтер",cat:"psych-gen",status:"later",badge:"Трек Б, входная точка",
toc:"Курс лекций (порядок и нумерацию сверь с вашим изданием): предмет психологии и её задачи; история психологии и основные школы (интроспекционизм, бихевиоризм, гештальт-психология, психоанализ, когнитивная и гуманистическая психология); методы психологии; психика и мозг; ощущение; восприятие; внимание; память; мышление; эмоции и воля; личность, способности, темперамент; деятельность и сознание.",
why:"Классический вводный курс — методология психологии как науки.",
give:"База для будущего психотерапевтического образования, не для медицины напрямую. Хорошая входная точка в академическую психологию."},

{t:"Дар психотерапии",a:"Ирвин Ялом",cat:"nonfiction",status:"now",badge:"Уже читаешь",
toc:"Около 85 коротких глав-советов (это темы, а не дословные названия глав): выстраивание отношений с пациентом; эмпатия и присутствие; работа «здесь и сейчас»; перенос и контрперенос; самораскрытие терапевта; работа со сновидениями; тревога смерти и смысл жизни; сопротивление и трудные пациенты; ошибки и границы терапевта; забота терапевта о себе; завершение терапии.",
why:"Короткие главы-размышления о практике психотерапии от практикующего психиатра.",
give:"Интуиция про терапевтические отношения в целом, независимо от школы. Идеально для вечернего чтения."},

{t:"Лжец на кушетке",a:"Ирвин Ялом",cat:"fiction",status:"later",badge:"Художественная проза, не рабочий трек",
toc:"Это роман, а не сборник глав, поэтому оглавления в привычном смысле нет. Сюжет строится вокруг двух психотерапевтов с противоположным отношением к профессиональной этике: один старается быть честным с пациентами, другой манипулирует ими. Повествование чередует терапевтические сеансы и профессиональные интриги, главы короткие и читаются как отдельные сцены.",
why:"Беллетристика, использующая психотерапию как материал для сюжета.",
give:"Хорошая литература для удовольствия — не двигает к цели, но и не вредит. Читать отдельно от рабочего списка."},

{t:"Палач любви",a:"Ирвин Ялом",cat:"nonfiction",status:"now",badge:"Продолжение Дара психотерапии",
toc:"Сборник из десяти историй терапии (названия и порядок глав сверь в издании; здесь только темы): история пациентки с зависимой любовью и одержимостью; терапия пациентки с избыточным весом и стыдом за тело; работа с одиночеством и утратой близких; страх смерти как источник тревоги; сексуальная одержимость и границы терапевта; горе и невозможность отпустить; поиск смысла и ответственность за собственную жизнь. В конце автор обсуждает собственные ошибки и сомнения как терапевта.",
why:"Сборник реальных случаев, тот же нон-фикшн формат, что 'Дар психотерапии'.",
give:"Больше конкретных клинических историй в уже знакомом лёгком формате."},

{t:"Человек, который принял жену за шляпу",a:"Оливер Сакс",cat:"nonfiction",status:"now",badge:"Уже читаешь",
toc:"Четыре части (проверь нумерацию в своём издании). I. Потери: «Человек, который принял жену за шляпу», «Потерянный мореход», «Бестелесная Кристина», «Человек, выпавший из кровати», «Руки», «Фантомы», «На ровном месте», «Смотреть направо!», «Речь президента». II. Излишки: «Дело тождества», «Да, отец-сестра», «Одержимая», «Остроумный тикующий Рэй», «Болезнь Купидона». III. Переносы: «Собака под кожей», «Реминисценция», «Вечная ностальгия», «Путешествие в Индию», «Убийство», «Проблеск видения». IV. Мир простых: «Ребекка», «Ходячее чудо», «Близнецы», «Художник-аутист». Названия даны по памяти в русском переводе и могут отличаться в твоём издании.",
why:"Реальные клинические случаи неврологических пациентов, поданные с сочувствием.",
give:"Лёгкий, увлекательный вход в нейропсихиатрию, не требует подготовки."},

{t:"Пробуждения",a:"Оливер Сакс",cat:"nonfiction",status:"now",badge:"Продолжение цикла Сакса",
toc:"Структура (по темам, точные названия сверь в издании): предисловия и введение об эпидемии летаргического энцефалита и постэнцефалитическом паркинсонизме; основная часть — истории болезни отдельных пациентов (их описание до лечения, «пробуждение» на L-DOPA и последующие осложнения: тики, возбуждение, срывы); часть «Перспективы» — размышления о природе болезни, здоровья и лекарства; эпилог об этике и о том, что стало с пациентами.",
why:"Знаменитая книга, легла в основу фильма с тем же названием.",
give:"Тот же формат, что уже прочитанные книги Сакса — доступно, клинически, эмоционально."},

{t:"Галлюцинации",a:"Оливер Сакс",cat:"nonfiction",status:"now",badge:"Уже читаешь",

const CATS = {
psy:"Психиатрия", neuro:"Неврология/нейронаука", "psych-gen":"Общая психология",
popsci:"Научпоп", psychotherapy:"Психотерапия (школы)", nonfiction:"Клинич. нон-фикшн",
fiction:"Худож. проза", anatomy:"Анатомия", medbase:"Медицинская база"
};
const STATUS_LABELS = {now:"b-now", later:"b-later", skip:"b-skip", caution:"b-skip", track:"b-track"};

let activeCat = 'all';
let query = '';

function plural(n){const m10=n%10,m100=n%100;return m10===1&&m100!==11?'книга':m10>=2&&m10<=4&&(m100<12||m100>14)?'книги':'книг';}

function render(){
  const list = DATA.filter(b=>(activeCat==='all'||b.cat===activeCat) && (!query || b.t.toLowerCase().includes(query) || b.a.toLowerCase().includes(query)));
  const el = document.getElementById('list');
  if(!list.length){el.innerHTML='<p class="empty">Ничего не найдено.</p>';return;}
  el.innerHTML = list.map((b,i)=>`
    <div class="card" role="button" tabindex="0" aria-expanded="false" aria-controls="d${i}" data-i="${i}">
      <span class="badge ${STATUS_LABELS[b.status]||'b-later'}">${b.badge}</span>
      <h3>${b.t}</h3>
      <div class="author">${b.a}</div>
      <div class="details" id="d${i}">
        <h4>📑 Оглавление / основные темы</h4>
        <div class="toc">${b.toc}</div>
        <h4>❓ Зачем эта книга</h4>
        <div>${b.why}</div>
        <h4>🎯 Что она даёт лично тебе</h4>
        <div>${b.give}</div>
      </div>
    </div>`).join('');
}

function toggle(card){
  const open = document.getElementById('d'+card.dataset.i).classList.toggle('open');
  card.setAttribute('aria-expanded', open);
}

const listEl = document.getElementById('list');
listEl.addEventListener('click', e=>{
  if(e.target.closest('a')) return;
  const card = e.target.closest('.card');
  if(card) toggle(card);
});
listEl.addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.classList.contains('card')){e.preventDefault();toggle(e.target);}
});

function makeFilters(){
  const el = document.getElementById('filters');
  let html = `<button class="filter-btn active" data-cat="all" aria-pressed="true">Все (${DATA.length})</button>`;
  Object.keys(CATS).forEach(c=>{
    const n = DATA.filter(b=>b.cat===c).length;
    html += `<button class="filter-btn" data-cat="${c}" aria-pressed="false">${CATS[c]} (${n})</button>`;
  });
  el.innerHTML = html;
  el.addEventListener('click', e=>{
    const btn = e.target.closest('.filter-btn');
    if(!btn) return;
    el.querySelectorAll('.filter-btn').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-pressed','false');});
    btn.classList.add('active');btn.setAttribute('aria-pressed','true');
    activeCat = btn.dataset.cat;
    render();
  });
}

document.getElementById('search').addEventListener('input', e=>{
  query = e.target.value.trim().toLowerCase();
  render();
});

document.getElementById('subtitle').textContent = `${DATA.length} ${plural(DATA.length)}: оглавление, зачем нужна, что даёт лично тебе`;
makeFilters();
render();
</script>
