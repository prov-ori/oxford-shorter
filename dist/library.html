<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Личная библиотека: что читать сейчас, что позже и зачем нужна каждая книга.">
<meta name="theme-color" content="#233e36"><title>Книги · Учебная библиотека</title>
<link rel="stylesheet" href="styles.css">
<style>
.nav-link[aria-current=page]{background:var(--tint)}
.lib{max-width:920px;margin:0 auto;padding:44px 40px 0}
.lib h1{font-size:44px}
.lib h1 em{color:#6e8a6c}
.lib-lede{max-width:600px;color:var(--muted);font-size:15px}
.lib-status{display:grid;grid-template-columns:repeat(3,1fr);margin:34px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.lib-status button{background:none;border-radius:0;text-align:left;padding:18px 20px 16px;border-left:1px solid var(--line);color:var(--ink);position:relative}
.lib-status button:first-child{border-left:0;padding-left:0}
.lib-status strong{display:block;font:400 34px/1.1 Georgia,serif;margin-top:6px}
.lib-status small{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.4}
.lib-status button[aria-pressed=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--dot)}
.lib-status button:first-child[aria-pressed=true]::after{left:0}
.lib-status button:hover{filter:none;background:var(--tint)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dot);margin-right:7px;vertical-align:1px}
.s-have{--dot:#3d7a5c}.s-ru{--dot:#c4924f}.s-eu{--dot:#6f8fb0}
.lib-tools{position:sticky;top:0;z-index:5;background:var(--paper);padding:18px 0 14px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.lib-tools .search{background:var(--surface)}
.lib-tools .search input{font-size:14px;outline:none}
.lib-tools .search:focus-within{border-color:var(--green);box-shadow:0 0 0 3px #bb835166}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink)}
.chips button span{color:var(--muted);margin-left:3px}
.chips button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.chips button[aria-pressed=true] span{color:#cfe0d6}
.lib-count{font-size:12px;color:var(--muted);margin:18px 0 0;display:flex;justify-content:space-between;gap:12px}
.lib-count button{background:none;padding:0;color:var(--green);font-weight:600;font-size:12px}
.books{list-style:none;padding:0;margin:0}
.book{border-bottom:1px solid var(--line)}
.book-head{display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:start;width:100%;background:none;border-radius:0;text-align:left;color:var(--ink);padding:20px 0}
.book-head:hover{filter:none}
.book-head:hover .book-title{color:var(--green)}
.book-title{font:400 21px/1.3 Georgia,serif;display:block}
.book-author{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.book-meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:9px;font-size:12px}
.book-meta .badge{background:none;padding:0;font-size:12px;white-space:normal;color:var(--ink)}
.book-cat{color:var(--muted)}
.chev{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:transform .2s;font-size:13px;margin-top:2px}
.book-head[aria-expanded=true] .chev{transform:rotate(180deg);background:var(--tint)}
.book-body{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;padding:2px 0 28px}
.book-body[hidden]{display:none}
.book-body h3{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:10px}
.book-body p{margin:0;font-size:14px;line-height:1.7}
.book-why{display:grid;gap:22px;align-content:start}
.book-why>div{border-left:2px solid var(--line);padding-left:16px}
.toc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;font-size:13.5px;line-height:1.65}
.toc ol,.toc ul{margin:0;padding-left:22px}
.toc li{padding:2px 0}
.toc p+p,.toc ol+p,.toc ul+p{margin-top:12px}.toc ul+p{margin-bottom:0}
.toc .toc-part{font-weight:600}
.toc .toc-intro{color:var(--muted);margin-bottom:10px}
.toc li::marker{color:var(--muted);font-size:12px}
.toc a{font-weight:600}
.group-head{list-style:none}
.group-title{font:400 24px/1.3 Georgia,serif;margin:34px 0 0;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.group-title small{font:12px/1 'Segoe UI',Arial,sans-serif;color:var(--muted);margin-left:8px}
.book-static{padding:20px 0}
.book-static .book-meta{margin-top:9px}
.no-info{display:block;color:var(--muted);font-size:12px;margin-top:8px}
.lib-empty{padding:40px 0;text-align:center;color:var(--muted)}
.lib footer{margin-top:40px}
@media(max-width:850px){.lib{padding:30px 26px 0}.lib h1{font-size:36px}.book-body{grid-template-columns:1fr;gap:22px}}
@media(max-width:580px){.top-actions{gap:0}.top-actions .nav-link{padding:9px 6px}.lib{padding:22px 16px 0}.lib h1{font-size:30px;letter-spacing:-.8px}
.lib-status button{padding:14px 10px 12px}.lib-status strong{font-size:28px}.lib-status small{display:none}.lib-status .eyebrow{font-size:9px;letter-spacing:1px}
.lib-tools{padding:12px 0 10px}.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.chips button{flex:none}
.book-title{font-size:19px}}
@media(prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
</head>

<script>
const DATA = [
{"t":"Основы психофармакологии","a":"Стивен М. Стал","group":"ru","cat":"psy","badge":"Медвуз, приоритет №3","toc":"1. Химические посредники: нейротрансмиттеры, рецепторы, сигнальные каскады, G-белки. 2. Синапс и принципы нейропередачи. 3. Антидепрессанты: SSRI, SNRI, трициклики, MAOI, атипичные — механизмы и различия. 4. Антипсихотики: типичные vs атипичные, D2-блокада, серотонин-дофаминовая гипотеза шизофрении. 5. Стабилизаторы настроения: литий, вальпроаты, ламотриджин — механизмы при биполярном расстройстве. 6. Анксиолитики: бензодиазепины, буспирон, GABA-система. 7. Снотворные и хронобиология сна. 8. Психостимуляторы и лечение СДВГ. 9. Психофармакология деменции. 10. Особые популяции: беременность, пожилой возраст, дети. 11. Фармакогенетика и персонализированная психофармакология.","why":"Не таблицы дозировок (это Prescriber's Guide), а именно механизмы — почему конкретный препарат работает на нейрохимическом уровне.","give":"Oxford скажет 'при депрессии используют SSRI'. Stahl объяснит, почему именно SSRI и что происходит в синапсе."},
{"t":"Психиатрия и медицинская психология","a":"Н.Н. Иванец, Ю.Г. Тюльпин, М.А. Кинкулькина","group":"ru","cat":"psy","badge":"Дублирует Oxford","toc":"1. Общая психопатология: расстройства ощущений, восприятия, памяти, мышления, эмоций, воли, сознания. 2. Методы обследования психиатрического больного. 3. Шизофрения и расстройства шизофренического спектра. 4. Аффективные расстройства (депрессия, мания, биполярное). 5. Невротические, связанные со стрессом расстройства (неврозы, ПТСР, ОКР). 6. Расстройства личности (психопатии). 7. Умственная отсталость. 8. Органические психические расстройства (деменции, экзогенно-органические психозы). 9. Эпилепсия и психические нарушения при ней. 10. Наркология: алкоголизм, наркомании, токсикомании. 11. Детская и подростковая психиатрия. 12. Судебная психиатрия и вопросы дееспособности. 13. Основы медицинской психологии: психология больного, деонтология, психосоматика. 14. Организация психиатрической помощи в РФ, законодательство.","why":"Российский учебник, построен под российскую номенклатуру и организацию здравоохранения, местами расходится с ICD-11 и европейской практикой.","give":"Дублирует функцию Oxford, но под другую систему здравоохранения, которая не твоя. Не приоритет — Oxford для твоего контекста ценнее."},
{"t":"Клиническое интервью","a":"Джон, Рита Соммерз-Фланаган","group":"ru","cat":"psy","badge":"Горизонт резидентуры","toc":"1. Основы и этика клинического интервью. 2. Слушание и построение раппорта. 3. Невербальная коммуникация в интервью. 4. Структура интервью: открытие, основная часть, завершение. 5. Техники опроса: открытые/закрытые вопросы, отражение, прояснение. 6. Оценка психического статуса (Mental Status Exam). 7. Сбор анамнеза: история болезни, семейный анамнез, социальный анамнез. 8. Оценка суицидального риска и риска насилия. 9. Работа с сопротивлением и трудными клиентами. 10. Интервью с детьми и подростками. 11. Интервью с парами и семьями. 12. Мультикультурная компетентность в интервью. 13. Особые популяции: пожилые, люди с ограниченными возможностями. 14. Постановка диагноза и написание заключения.","why":"Практический навык ведения психиатрического/психологического интервью — не теория, а техника разговора с пациентом.","give":"Полезно, но требует реальной практики с пациентами для закрепления. Читать без клинического контекста — как учить плавать по книге. Отложи до практики/резидентуры."},
{"t":"Наркология. Национальное руководство","a":"под ред. Н. Н. Иванца","group":"ru","cat":"psy","toc":"Основные разделы издания 2008 года (общая структура; формулировки обобщённые, сверь с точным оглавлением своего экземпляра): 1. Эпидемиология наркологических заболеваний 2. Организация наркологической помощи 3. Медико-биологические проблемы наркологии 4. Общая психопатология наркологических заболеваний 5. Классификация наркологических заболеваний 6. Клиническая наркология 7. Диагностика употребления психоактивных веществ 8. Лечение, реабилитация и профилактика 9. Медицинские, социальные и этические вопросы наркологии","why":"Фундаментальное медицинское руководство по расстройствам, связанным с употреблением алкоголя, наркотиков и других психоактивных веществ: эпидемиология, механизмы возникновения, клиническая картина, диагностика, лечение, реабилитация и профилактика. Отдельно рассматриваются организация наркологической помощи, сопутствующие психические и соматические нарушения, экспертиза и социальные аспекты. Рассчитано в первую очередь на психиатров-наркологов, врачей других специальностей и тех, кто проходит медицинскую подготовку. Существуют и более поздние издания: полное 2016 года и краткое 2020 года; проверь, какое у тебя.","give":"Справочник, а не книга для чтения подряд. Дополняет главу Oxford о злоупотреблении алкоголем и психоактивными веществами российской клинической практикой."},
{"t":"Основы доказательной медицины","a":"Триша Гринхальх","group":"ru","cat":"medbase","toc":"17 глав; в конце — приложения с проверочными листами для оценки исследований и материалами по оценке эффекта вмешательств. Список получен вне книги и по числу глав совпадает с английским оригиналом «How to Read a Paper» (5-е издание); в русском издании главы могут быть другими, сверь с ним. 1. Зачем читать медицинские статьи? 2. Поиск литературы 3. С чего начать: о чём эта статья? 4. Оценка методологического качества 5. Статистика для неспециалиста 6. Клинические испытания лекарственных средств 7. Исследования комплексных вмешательств 8. Исследования диагностических и скрининговых тестов 9. Систематические обзоры и метаанализы 10. Клинические рекомендации 11. Экономические анализы медицинской помощи 12. Качественные исследования 13. Анкетные исследования 14. Исследования по улучшению качества 15. Исследования генетических ассоциаций 16. Использование доказательной медицины пациентами 17. Критика доказательной медицины","why":"Практическое руководство по поиску, анализу и критической оценке медицинских исследований: как формулировать клинические вопросы, находить публикации, оценивать достоверность результатов и применять данные в клинических решениях. Рассматриваются клинические испытания, диагностические тесты, систематические обзоры, метаанализы, клинические рекомендации и статистика; особое внимание — ограничениям исследований и различию между статистической значимостью и реальной пользой лечения. Русское издание — перевод «How to Read a Paper».","give":"База для критического чтения исследований, в том числе тех, на которые опирается Oxford (в нём есть глава о доказательных подходах в психиатрии). Учит задавать статье вопросы, а не принимать вывод на веру."},
{"t":"Shorter Oxford Textbook of Psychiatry. 8th edition","a":"Harrison, Cowen, Bhui, Fazel","group":"have","cat":"psy","badge":"Медвуз, приоритет №1","toc":"26 глав (по сверенному оглавлению PDF; учебный перевод — <a href=\"./\">на главной странице этого сайта</a>): 1. Признаки и симптомы психических расстройств. 2. Классификация. 3. Психиатрическое обследование. 4. Этика и гражданское право. 5. Этиология. 6. Доказательные подходы в психиатрии. 7. Реакции на стрессовые переживания. 8. Тревожные и обсессивно-компульсивные расстройства. 9. Депрессия. 10. Биполярное расстройство. 11. Шизофрения. 12. Параноидные симптомы и синдромы. 13. Расстройства пищевого поведения, сна и бодрствования и сексуальные расстройства. 14. Деменция, делирий и другие нейропсихиатрические расстройства. 15. Личность и расстройства личности. 16. Детская и подростковая психиатрия. 17. Расстройства интеллектуального развития. 18. Судебная психиатрия. 19. Психиатрия пожилого возраста. 20. Злоупотребление алкоголем и психоактивными веществами. 21. Самоубийство и самоповреждение. 22. Психиатрия и медицина. 23. Общественное и глобальное психическое здоровье. 24. Психологические методы лечения. 25. Лекарственные средства и другие физические методы лечения. 26. Психиатрические службы.","why":"Главная карта специальности. Построен под ICD — систему, по которой будешь практиковать в Европе (в отличие от Kaplan&Sadock/DSM).","give":"Даёт целостную картину: что вообще входит в психиатрию, как выглядит каждое расстройство клинически. Без этого всё остальное (Stahl, Fish, Blumenfeld) — разрозненные фрагменты без каркаса."},
{"t":"Fish’s Clinical Psychopathology. 5th edition","a":"Patricia Casey, Brendan Kelly","group":"have","cat":"psy","badge":"Медвуз, приоритет №2","toc":"1. Введение в описательную психопатологию и метод. 2. Расстройства восприятия: иллюзии, истинные галлюцинации, псевдогаллюцинации (по модальностям: слуховые, зрительные, тактильные, обонятельные). 3. Расстройства мышления по форме: ускорение/замедление, разорванность, персеверация, неологизмы. 4. Расстройства мышления по содержанию: бред (типы — преследования, величия, ревности, воздействия), сверхценные идеи, навязчивости. 5. Расстройства речи и языка. 6. Расстройства аффекта: депрессивный, маниакальный, тревожный, уплощённый, неадекватный аффект. 7. Расстройства влечений и психомоторики: кататония, ступор, возбуждение. 8. Расстройства сознания: оглушение, делирий, сумеречное состояние. 9. Расстройства памяти и ориентировки: амнезии, конфабуляции. 10. Расстройства самосознания (деперсонализация/дереализация). 11. Синдромология: как симптомы складываются в синдромы.","why":"Не про расстройства целиком, а про точное описание отдельных симптомов — язык психиатрической диагностики.","give":"Учит разницу между апатией и ангедонией, истинной и псевдогаллюцинацией. Без этого точного словаря клиническое наблюдение остаётся расплывчатым."},
{"t":"Тайны нашего мозга","a":"Сандра Амодт, Сэм Вонг","group":"have","cat":"popsci","toc":"6 частей и 31 глава. Часть 1: Ваш мозг и окружающий мир 1. Можно ли доверять своему мозгу? 2. Серое вещество мозга и киноэкран 3. Мыслящее мясо: нейроны и синапсы 4. Удивительные ритмы: биологические часы 5. Примерьте купальник: регулирование веса Часть 2: Органы чувств 6. Рассматривая себя: зрение 7. Как пережить вечеринку: слух 8. О вкусах не спорят (и о запахах) 9. Касаясь основ: осязание Часть 3: Как меняется наш мозг на протяжении жизни 10. Растим вундеркинда: раннее детство 11. Развитие ребёнка: сенситивные периоды и язык 12. Бунты и их причины: детство и подростковый возраст 13. Образовательный тур: обучение 14. Восхождение на вершину горы: старение 15. Продолжается ли в наши дни эволюция мозга? Часть 4: Ваш эмоциональный мозг 16. Стихия мозга: эмоции 17. Тревожность 18. Счастье и как его найти 19. Что там внутри? Личность 20. Пол, любовь и образование пар Часть 5: Ваш рациональный мозг 21. Как принять решение 22. Интеллект (и его недостаток) 23. Наш фотоальбом: память 24. Рациональность без причины: аутизм 25. Разница в когнитивных процессах между полами Часть 6: Изменённые состояния сознания 26. Изучение сознания 27. Что нам снится: нейробиология сна 28. Паломничество: духовное начало 29. Инсульт 30. Наркотики и алкоголь 31. Виды глубинной терапии мозга","why":"Научно-популярная книга о том, как мозг воспринимает мир, управляет поведением, принимает решения и иногда вводит нас в заблуждение. Нейробиологи Сандра Амодт и Сэм Вонг объясняют механизмы памяти, эмоций, обучения, сна, сознания и работы органов чувств, разбирают распространённые представления о мозге и показывают, какие из них подтверждаются исследованиями. Полное название — «Тайны нашего мозга, или Почему умные люди делают глупости»; оригинал — «Welcome to Your Brain» (2008).","give":"Лёгкий вход в нейробиологию перед Лурией: объясняет, почему люди ошибаются и как меняются когнитивные способности с возрастом. Не клинический учебник."},
{"t":"Основы общей психологии","a":"Сергей Рубинштейн","group":"have","cat":"psych-gen","badge":"Трек Б, дублирует","toc":"1. Предмет психологии и её задачи. 2. Методы психологии. 3. История развития психологии как науки. 4. Развитие психики в филогенезе. 5. Развитие поведения и психики животных. 6. Проблема сознания. 7. Деятельность (структура, виды). 8. Ощущение. 9. Восприятие (свойства, виды, восприятие пространства/времени/движения). 10. Память (виды, процессы запоминания, забывание). 11. Воображение. 12. Мышление и речь. 13. Внимание. 14. Эмоции и чувства. 15. Воля. 16. Темперамент и характер. 17. Способности. 18. Личность: направленность, самосознание.","why":"Классический советский учебник общей психологии, тяжеловесный академический стиль.","give":"Общая эрудиция для будущего психотерапевтического обучения. У тебя уже 2-3 похожих книги (Гиппенрейтер, Лурия-лекции) — избыточность, не читай все подряд."},
{"t":"Лекции по общей психологии","a":"А. Р. Лурия","group":"have","cat":"psych-gen","badge":"Трек Б, пара с Выготским","toc":"1. Предмет психологии, её место среди наук. 2. Психология и мозг: проблема локализации функций. 3. Ощущения: виды, законы психофизики. 4. Восприятие: константность, предметность, категориальность. 5. Внимание: непроизвольное и произвольное, нейрофизиология внимания. 6. Память: виды, процессы, нарушения памяти. 7. Эмоции: физиологические основы, теории эмоций. 8. Речь и мышление: развитие понятий, внутренняя речь. 9. Движения и действия: произвольная регуляция. 10. Личность: культурно-историческая концепция развития.","why":"Изложение общей психологии в русле школы Выготского, автор которой лично соавтор Выготского.","give":"Логично читать рядом с 'Мышление и речь' Выготского — одна теоретическая традиция, усиливают друг друга."},
{"t":"Психология развития","a":"Грэйс Крайг, Дон Бокум","group":"have","cat":"psych-gen","badge":"Трек Б, закрывает реальный пробел","toc":"1. Основы теории развития (Пиаже, Эриксон, Выготский, этология). 2. Наследственность и пренатальное развитие. 3. Рождение и период новорождённости. 4. Физическое и когнитивное развитие в младенчестве. 5. Психосоциальное развитие младенца (привязанность). 6. Раннее детство: физическое, когнитивное, психосоциальное развитие. 7. Среднее детство (школьный возраст): развитие интеллекта, Я-концепции, отношения со сверстниками. 8. Подростковый возраст: пубертат, идентичность, отношения с родителями. 9. Ранняя взрослость: карьера, близкие отношения. 10. Средняя взрослость: кризис среднего возраста, семья. 11. Поздняя взрослость: старение, когнитивные изменения. 12. Смерть, умирание и утрата.","why":"Единственная книга в общем психологическом блоке про конкретно возрастную динамику — остальные фокусируются на когнитивных процессах.","give":"Критично для будущей практики: отличать возрастную норму от патологии, понимать детскую/подростковую и гериатрическую психиатрию."},
{"t":"Социальная психология","a":"Дэвид Майерс","group":"have","cat":"psych-gen","badge":"Трек Б, расширяет Чалдини","toc":"1. Введение в социальную психологию: методы исследования. 2. Я в социальном мире: самооценка, самоэффективность, локус контроля. 3. Социальные убеждения и суждения: атрибуция, самоисполняющиеся пророчества. 4. Установки и поведение. 5. Сила ситуации: конформность, подчинение авторитету (Милгрэм), эффект свидетеля. 6. Убеждение: элементы, маршруты убеждения. 7. Групповое влияние: социальная фасилитация, огруппление мышления, деиндивидуация. 8. Предрассудки: природа, причины, последствия. 9. Агрессия: теории, влияющие факторы. 10. Привлекательность и близкие отношения: любовь, привязанность. 11. Просоциальное поведение (альтруизм). 12. Конфликт и примирение.","why":"Академичнее и шире, чем уже имеющийся Чалдини (который фокусируется только на убеждении).","give":"Понимание социального контекста поведения пациента — не клинический навык напрямую, но полезный фон мышления."},
{"t":"Основы нейропсихологии","a":"А. Р. Лурия","group":"have","cat":"neuro","badge":"Можно читать уже сейчас","toc":"1. Мозг как субстрат психической деятельности — три функциональных блока мозга (по Лурии). 2. Проблема локализации высших психических функций. 3. Нарушения при поражении затылочных отделов (зрительные агнозии). 4. Нарушения при поражении теменных отделов (соматосенсорные расстройства, апраксии). 5. Нарушения при поражении височных отделов (слуховые агнозии, афазии — сенсорная, акустико-мнестическая). 6. Нарушения при поражении лобных долей (регуляция поведения, лобный синдром, персеверации). 7. Нарушения памяти при разных локализациях. 8. Методы нейропсихологической диагностики (батарея Лурии).","why":"Классический труд основателя нейропсихологии — реальные клинические наблюдения связи мозг-поведение.","give":"Прямое попадание в твой интерес к нейропсихиатрии. Не требует медицинской базы, можно читать уже сейчас."},
{"t":"Психология стресса","a":"Роберт Сапольски","group":"have","cat":"popsci","badge":"Можно читать уже сейчас","toc":"1. Что такое стресс: эволюционная логика реакции 'бей или беги'. 2. Стресс и сердечно-сосудистая система (гипертония, атеросклероз). 3. Стресс и энергетический метаболизм. 4. Стресс, пищеварение и язвы. 5. Стресс и рост (влияние на детей). 6. Стресс и иммунная система. 7. Стресс, боль и память. 8. Стресс и сон. 9. Стресс и старение. 10. Стресс и депрессия — ось HPA и кортизол. 11. Личность, характер и уязвимость к стрессу. 12. Социальный статус и стресс (иерархии). 13. Управление стрессом: что реально работает.","why":"Прямая биологическая база, которая напрямую пересекается с психиатрией (депрессия, тревожные расстройства, ПТСР).","give":"Понимание механизма, который будешь снова видеть в физиологии и психиатрии — не изолированный научпоп, а реальный фундамент."},
{"t":"Теории личности","a":"Ларри Хьелл, Дэниел Зиглер","group":"have","cat":"psych-gen","badge":"Трек Б","toc":"1. Введение: что такое теория личности, критерии оценки теорий. 2. Психодинамическое направление: Фрейд (структура личности, психосексуальные стадии, защитные механизмы). 3. Аналитическая психология Юнга: архетипы, коллективное бессознательное. 4. Индивидуальная психология Адлера: комплекс неполноценности, стиль жизни. 5. Эго-психология: Эриксон, стадии психосоциального развития. 6. Диспозициональное направление: Олпорт (черты личности), Кеттелл (факторный анализ), Айзенк (типы). 7. Бихевиористское направление: Скиннер, оперантное обусловливание. 8. Теория социального научения: Бандура, самоэффективность. 9. Когнитивное направление: Келли, теория личностных конструктов. 10. Гуманистическое направление: Маслоу (иерархия потребностей, самоактуализация), Роджерс (Я-концепция, клиент-центрированный подход). 11. Экзистенциальная психология: Мэй, Франкл. 12. Сравнение теорий и практическое применение.","why":"Сравнительный обзор основных теоретических рамок понимания личности.","give":"База для будущего психотерапевтического образования — понимание, из какой теории растёт каждая терапевтическая школа."},
{"t":"Когнитивная психология","a":"Роберт Солсо","group":"have","cat":"psych-gen","badge":"Трек Б","toc":"1. Введение и история когнитивной психологии. 2. Нейрокогнитивные основы познания. 3. Восприятие: теории распознавания образов. 4. Внимание: селективное внимание, модели фильтрации. 5. Память: сенсорная, кратковременная, рабочая память. 6. Долговременная память: эпизодическая, семантическая, процедурная. 7. Забывание и искажения памяти. 8. Репрезентация знаний: понятия, категории, схемы. 9. Зрительные образы (мысленные представления). 10. Язык: понимание и порождение речи. 11. Решение задач и творческое мышление. 12. Принятие решений и рассуждение. 13. Человеческий и искусственный интеллект.","why":"Более современный и структурированный, экспериментально обоснованный взгляд, чем классические советские учебники.","give":"Читать после базовых вводных текстов (Гиппенрейтер) — даёт более строгую, современную картину когнитивных процессов."},
{"t":"Детская психиатрия, психотерапия и медицинская психология","a":"","group":"have","cat":"psy","badge":"Горизонт субспециализации","toc":"1. Норма психического развития по возрастам. 2. Методы обследования ребёнка. 3. Расстройства аутистического спектра. 4. СДВГ и гиперкинетические расстройства. 5. Расстройства поведения (оппозиционно-вызывающее, кондуктное). 6. Тревожные расстройства детского возраста (сепарационная тревога, школьная фобия). 7. Депрессия у детей и подростков, суицидальность. 8. Тики и синдром Туретта. 9. Энурез и энкопрез. 10. Нарушения пищевого поведения у детей. 11. Умственная отсталость. 12. Специфические расстройства развития (речи, учебных навыков). 13. Психосоматические расстройства у детей. 14. Детская медицинская психология: реакция на болезнь, госпитализм. 15. Семейная терапия и работа с родителями. 16. Психофармакология в детском возрасте.","why":"Узкая субспециализация детской психиатрии — отдельная область внутри психиатрии.","give":"Полезно, только если решишь специализироваться именно на детской/подростковой психиатрии — не общий приоритет сейчас."},
{"t":"Психология эмоций","a":"Пол Экман","group":"have","cat":"popsci","badge":"Можно читать когда угодно","toc":"1. Что такое эмоция: определение, компоненты. 2. Универсальность базовых эмоций (гнев, страх, отвращение, удивление, радость, печаль) — кросс-культурные исследования. 3. Мимическое выражение эмоций: система кодирования лицевых движений (FACS). 4. Микровыражения и обнаружение скрываемых эмоций. 5. Гнев: триггеры, физиология, управление. 6. Страх и связанные состояния (тревога). 7. Отвращение и его эволюционная функция. 8. Печаль и горе. 9. Удивление как самая короткая эмоция. 10. Обман: как распознать ложь по невербальным сигналам. 11. Эмоциональная осознанность и регуляция эмоций.","why":"Исследования базовых эмоций и их универсальных выражений на лице.","give":"Общая эрудиция, смежная тема с эмоциональной регуляцией в психиатрии. Лёгкое чтение без предварительной базы."},
{"t":"Биология добра и зла","a":"Роберт Сапольски","group":"have","cat":"popsci","badge":"Не для тяжёлых эмоциональных периодов","toc":"1. Введение: поведение как результат множества причинных уровней. 2. За секунду до: нейробиология поступка (миндалина, префронтальная кора). 3. За секунды-минуты до: гормоны и поведение (тестостерон, окситоцин). 4. За часы-дни до: пренатальное развитие и раннее детство. 5. За годы до: подростковый мозг и его созревание. 6. За века до: генетика поведения. 7. За тысячелетия до: эволюция сотрудничества и агрессии. 8. Культура и экология: как среда формирует моральные нормы. 9. Мы и Они: нейробиология групповой идентичности и предвзятости. 10. Иерархия, статус и стресс в социальных группах. 11. Эмпатия, альтруизм и просоциальное поведение. 12. Мораль: интуиция vs рассуждение. 13. Война и мир: биология межгруппового насилия. 14. Свобода воли и вопрос ответственности с точки зрения детерминизма. 15. Заключение: что делать с этим знанием.","why":"Общие биологические основы поведения — агрессия, мораль, групповое поведение — через нейробиологию, эндокринологию, эволюцию.","give":"Более общий контекст, чем 'Психология стресса', меньше прямой связи с психиатрией. Содержит тяжёлые темы (геноцид, жестокость) — не читать в эмоционально тяжёлые периоды."},
{"t":"Думай медленно… Решай быстро","a":"Даниэль Канеман","group":"have","cat":"popsci","badge":"Общая эрудиция","toc":"1. Две системы мышления: Система 1 (быстрая, интуитивная) и Система 2 (медленная, аналитическая). 2. Эвристики и предвзятости: доступность, репрезентативность, привязка (anchoring). 3. Сверхуверенность и иллюзия понимания. 4. Эвристика узнавания и субституция. 5. Теория перспектив: как люди оценивают риск и выгоду. 6. Эффект фрейминга: влияние формулировки на решение. 7. Неприятие потерь (loss aversion). 8. Эффект владения (endowment effect). 9. Ментальный учёт (mental accounting). 10. Прогнозирование и регрессия к среднему. 11. Два Я: испытывающее и помнящее (experiencing vs remembering self). 12. Счастье и благополучие с точки зрения двух систем.","why":"Классика по когнитивным искажениям и процессу принятия решений.","give":"Общая эрудиция, не привязана к специальности напрямую. Полезный кругозор."},
{"t":"Когнитивно-поведенческая терапия","a":"Джудит Бек","group":"have","cat":"psychotherapy","badge":"Терапевтическая школа №1","toc":"1. Введение в когнитивно-поведенческую терапию и её теоретическая база. 2. Когнитивная концептуализация случая. 3. Структура первой сессии. 4. Структура последующих сессий. 5. Активация поведения и постановка целей. 6. Выявление автоматических мыслей. 7. Выявление эмоций и их связь с мыслями. 8. Оценка и ответ на автоматические мысли (когнитивная реструктуризация). 9. Выявление промежуточных убеждений (правила, установки). 10. Изменение промежуточных убеждений. 11. Выявление и изменение глубинных (core) убеждений. 12. Дополнительные когнитивные и поведенческие техники. 13. Домашние задания в терапии. 14. Завершение терапии и профилактика рецидива. 15. Проблемы в терапии и работа с сопротивлением.","why":"Одна из основных доказательных школ психотерапии, конкретные техники работы с искажённым мышлением.","give":"Прикладная клиническая книга — актуальна ближе к этапу реального психотерапевтического обучения, не сейчас."},
{"t":"Общая психопатология (1 том)","a":"Карл Ясперс","group":"have","cat":"psy","badge":"Пересмотрено — не приоритет","toc":"Структура всего труда (граница между томами зависит от издания; сверь по оглавлению своих томов): Введение: предмет и методы психопатологии, феноменологический подход. Часть 1. Отдельные психические явления: субъективные переживания (феноменология: расстройства восприятия, представлений, мышления, сознания, чувств, влечений, самосознания), объективные проявления (функциональные нарушения памяти, внимания, интеллекта, психомоторики), соматические сопровождающие явления. Часть 2. Осмысленные связи психической жизни: понимающая психология, генетическое понимание, бред как непонятное. Часть 3. Причинные связи: объясняющая психология, наследственность, конституция, влияние среды и соматических болезней.","why":"Философско-методологический труд 1913 года о том, как мыслить о психических расстройствах — не клиническое руководство.","give":"Требует клинического опыта для полноценного усвоения. Читать после накопления базы (Sacks, Лурия, Oxford), а не как первый серьёзный текст — иначе абстракции без клинического якоря."},
{"t":"Общая психопатология (2 том)","a":"Карл Ясперс","group":"have","cat":"psy","badge":"Продолжение тома 1","toc":"Продолжение единого труда (сверь границу с оглавлением своего тома). Часть 3, продолжение: причинные связи, личность и характер, влияние социальной среды. Часть 4. Психическая жизнь как целое: систематика (классификация) психических болезней, процессы и развития личности, группы органических психозов, шизофрении, циклотимии, психопатий и неврозов. Часть 5. Ненормальная психическая жизнь в социальном и историческом аспекте: культура, история, социальные условия, роль психиатрии в обществе. Часть 6. Человек как целое: границы психопатологии, философские основания, свобода и экзистенция.","why":"Одна книга, разбитая издательством на два тома из-за объёма.","give":"Нужен только если читаешь том 1 — иначе владеешь половиной труда."},
{"t":"Введение в общую психологию","a":"Гиппенрейтер Ю. Б.","group":"have","cat":"psych-gen","badge":"Трек Б, входная точка","toc":"Курс лекций (порядок и нумерацию сверь с вашим изданием): предмет психологии и её задачи; история психологии и основные школы (интроспекционизм, бихевиоризм, гештальт-психология, психоанализ, когнитивная и гуманистическая психология); методы психологии; психика и мозг; ощущение; восприятие; внимание; память; мышление; эмоции и воля; личность, способности, темперамент; деятельность и сознание.","why":"Классический вводный курс — методология психологии как науки.","give":"База для будущего психотерапевтического образования, не для медицины напрямую. Хорошая входная точка в академическую психологию."},
{"t":"Дар психотерапии","a":"Ирвин Ялом","group":"have","cat":"nonfiction","badge":"Уже читаешь","toc":"Около 85 коротких глав-советов (это темы, а не дословные названия глав): выстраивание отношений с пациентом; эмпатия и присутствие; работа «здесь и сейчас»; перенос и контрперенос; самораскрытие терапевта; работа со сновидениями; тревога смерти и смысл жизни; сопротивление и трудные пациенты; ошибки и границы терапевта; забота терапевта о себе; завершение терапии.","why":"Короткие главы-размышления о практике психотерапии от практикующего психиатра.","give":"Интуиция про терапевтические отношения в целом, независимо от школы. Идеально для вечернего чтения."},
{"t":"Лжец на кушетке","a":"Ирвин Ялом","group":"have","cat":"fiction","badge":"Художественная проза, не рабочий трек","toc":"Это роман, а не сборник глав, поэтому оглавления в привычном смысле нет. Сюжет строится вокруг двух психотерапевтов с противоположным отношением к профессиональной этике: один старается быть честным с пациентами, другой манипулирует ими. Повествование чередует терапевтические сеансы и профессиональные интриги, главы короткие и читаются как отдельные сцены.","why":"Беллетристика, использующая психотерапию как материал для сюжета.","give":"Хорошая литература для удовольствия — не двигает к цели, но и не вредит. Читать отдельно от рабочего списка."},
{"t":"Палач любви","a":"Ирвин Ялом","group":"have","cat":"nonfiction","badge":"Продолжение Дара психотерапии","toc":"Сборник из десяти историй терапии (названия и порядок глав сверь в издании; здесь только темы): история пациентки с зависимой любовью и одержимостью; терапия пациентки с избыточным весом и стыдом за тело; работа с одиночеством и утратой близких; страх смерти как источник тревоги; сексуальная одержимость и границы терапевта; горе и невозможность отпустить; поиск смысла и ответственность за собственную жизнь. В конце автор обсуждает собственные ошибки и сомнения как терапевта.","why":"Сборник реальных случаев, тот же нон-фикшн формат, что 'Дар психотерапии'.","give":"Больше конкретных клинических историй в уже знакомом лёгком формате."},
{"t":"Человек, который принял жену за шляпу","a":"Оливер Сакс","group":"have","cat":"nonfiction","badge":"Уже читаешь","toc":"Четыре части (проверь нумерацию в своём издании). I. Потери: «Человек, который принял жену за шляпу», «Потерянный мореход», «Бестелесная Кристина», «Человек, выпавший из кровати», «Руки», «Фантомы», «На ровном месте», «Смотреть направо!», «Речь президента». II. Излишки: «Дело тождества», «Да, отец-сестра», «Одержимая», «Остроумный тикующий Рэй», «Болезнь Купидона». III. Переносы: «Собака под кожей», «Реминисценция», «Вечная ностальгия», «Путешествие в Индию», «Убийство», «Проблеск видения». IV. Мир простых: «Ребекка», «Ходячее чудо», «Близнецы», «Художник-аутист». Названия даны по памяти в русском переводе и могут отличаться в твоём издании.","why":"Реальные клинические случаи неврологических пациентов, поданные с сочувствием.","give":"Лёгкий, увлекательный вход в нейропсихиатрию, не требует подготовки."},
{"t":"Пробуждения","a":"Оливер Сакс","group":"have","cat":"nonfiction","badge":"Продолжение цикла Сакса","toc":"Структура (по темам, точные названия сверь в издании): предисловия и введение об эпидемии летаргического энцефалита и постэнцефалитическом паркинсонизме; основная часть — истории болезни отдельных пациентов (их описание до лечения, «пробуждение» на L-DOPA и последующие осложнения: тики, возбуждение, срывы); часть «Перспективы» — размышления о природе болезни, здоровья и лекарства; эпилог об этике и о том, что стало с пациентами.","why":"Знаменитая книга, легла в основу фильма с тем же названием.","give":"Тот же формат, что уже прочитанные книги Сакса — доступно, клинически, эмоционально."},
{"t":"Галлюцинации","a":"Оливер Сакс","group":"have","cat":"nonfiction","badge":"Уже читаешь","toc":"Главы по типам галлюцинаций (по темам, точные названия и порядок сверь в издании): зрительные галлюцинации при потере зрения (синдром Шарля Бонне); слуховые галлюцинации и «голоса»; галлюцинации при депривации (сенсорная, сон); гипнагогические и гипнопомпические образы; ночные кошмары и «старая карга»; мигренозные ауры; эпилепсия и галлюцинации; паркинсонизм и деменция с тельцами Леви; галлюцинации при психоактивных веществах; наркотические и религиозные переживания; ощущение присутствия, двойники (аутоскопия), внетелесный опыт; шизофрения и её место среди других видов галлюцинаций.","why":"Фокус на одном феномене — галлюцинациях разной природы, не только психиатрических.","give":"Продолжение темы восприятия и мозга в доступном формате."},
{"t":"Музыкофилия","a":"Оливер Сакс","group":"have","cat":"nonfiction","badge":"Расширение цикла Сакса","toc":"Главы по темам (порядок и названия сверь в издании): музыкальные судороги и «внезапная музыкофилия»; амузия и «тональная глухота»; навязчивые мелодии («червь в ухе»); музыкальные галлюцинации; абсолютный слух и синестезия; музыкальные таланты у савантов и при синдроме Вильямса; музыка при афазии, паркинсонизме и болезни Туретта; музыка и память при амнезии и деменции; музыкальная терапия; музыка и эмоции.","why":"Неврология восприятия музыки через необычные клинические случаи.","give":"Тот же проверенный формат — доступно и по теме."},
{"t":"Мышление и речь","a":"Лев Выготский","group":"have","cat":"psych-gen","badge":"Трек Б, пара с Лурией","toc":"1. Проблема и метод исследования. 2. Проблема речи и мышления ребёнка в учении Ж. Пиаже (эгоцентрическая речь). 3. Проблема речи и мышления в учении В. Штерна. 4. Генетические корни мышления и речи (доинтеллектуальная речь, доречевое мышление, их пересечение). 5. Экспериментальное исследование развития понятий (метод двойной стимуляции, стадии образования понятий). 6. Исследование развития научных понятий в детском возрасте (обучение и развитие, зона ближайшего развития). 7. Мысль и слово (внутренняя речь, значение слова, мотивация мысли).","why":"Теория связи развития мышления и речи, культурно-историческая концепция.","give":"Классика психологии развития, база для понимания школы Лурии. Плотный теоретический текст — читать рядом с 'Лекциями по общей психологии' Лурии."},
{"t":"С ума сойти","a":"Дарья Варламова, Антон Зайниев","group":"have","cat":"popsci","badge":"Популярный русскоязычный обзор","toc":"Главы по темам (точные названия сверь в издании): что такое психическая норма и патология; депрессия; тревожные расстройства и панические атаки; обсессивно-компульсивное расстройство; биполярное аффективное расстройство; шизофрения и психозы; расстройства пищевого поведения; расстройства личности; зависимости; травма и ПТСР; методы лечения: психотерапия и лекарства; мифы о психиатрии и стигма.","why":"Русскоязычный научпоп-гид по психическим расстройствам, написан журналистами с консультацией специалистов.","give":"Доступный вход в тему на русском, написан для широкой аудитории — не заменяет клинические учебники, но хорош для ориентации сейчас."},
{"t":"Психология влияния","a":"Роберт Чалдини","group":"have","cat":"popsci","badge":"Общая эрудиция","toc":"1. Оружие влияния (автоматические реакции, «щёлк-жжж»). 2. Взаимный обмен (правило взаимности, уступки и «отказ-затем-отступление»). 3. Приверженность и последовательность (маленькие шаги, письменные обязательства). 4. Социальное доказательство (следование за толпой, эффект свидетеля). 5. Благорасположение (привлекательность, сходство, комплименты, ассоциации). 6. Авторитет (символы и титулы, эксперимент Милгрэма). 7. Дефицит (ограниченность предложения и ограниченность времени). 8. Мгновенное влияние (как защищаться от автоматических триггеров). Названия глав даны по памяти и могут слегка отличаться в издании.","why":"Шесть принципов социального влияния и убеждения.","give":"Общий кругозор по социальной психологии — частично дублируется/расширяется книгой Майерса."},
{"t":"Я вижу, о чем вы думаете","a":"Джо Наварро","group":"have","cat":"popsci","badge":"Развлекательно-прикладное","toc":"Книга идёт по частям тела «снизу вверх» (названия глав сверь в издании): роль лимбического мозга и реакций «замри, беги, дерись» в невербальном поведении; ноги и стопы (самые честные сигналы); торс и туловище; руки и жесты; кисти и пальцы; лицо и мимика; принципы чтения языка тела: базовое поведение, комфорт и дискомфорт, «успокаивающие» жесты; как отличить ложь и стресс от обычного волнения; практическое применение в общении и переговорах.","why":"Написана бывшим агентом ФБР, практический взгляд на невербалику.","give":"Легковесное чтение, полезная бытовая эрудиция, не клинический инструмент — не путать с реальной диагностической наблюдательностью психиатра."},
{"t":"Биполярное расстройство","a":"Светлана Бозрова","group":"have","cat":"psy","toc":"Точное оглавление пока не подтверждено; названия глав не придумываю — сверь по своему экземпляру. Известно лишь, что в тексте есть раздел о депрессивной фазе («Фаза 1. Депрессия»), размышления о будущем и описание госпитализации в психиатрический стационар (это тема, а не название раздела).","why":"Автобиографическая книга о жизни с биполярным аффективным расстройством II типа. Светлана Бозрова, биолог и научный редактор, рассказывает об опыте депрессивных и гипоманиакальных эпизодов, диагностике, лечении и поиске устойчивости в повседневной жизни, о влиянии болезни на учёбу, работу, отношения и восприятие себя. Полное название — «Биполярное расстройство. Моя реальность» (АСТ, 256 с.). В отличие от клинических руководств, показывает расстройство глазами человека, который с ним живёт.","give":"Взгляд изнутри: как расстройство переживается, а не как диагностируется. Дополняет клиническое описание в Oxford (глава 10 «Биполярное расстройство»). Это опыт одного человека, а не обзор."},
{"t":"Аутизм у взрослых","a":"Зоя Соколова","group":"have","cat":"psy","toc":"По данным издательских материалов: три части, 40 глав и отдельное приложение для специалистов. Дословные названия глав неизвестны; ниже тематические блоки, а не заголовки: современные представления об аутизме; диагностические критерии и дифференциальная диагностика; женский фенотип аутизма; маскировка аутичных особенностей; сенсорные особенности и повседневная жизнь; дружба, партнёрство и сексуальность; работа и социальное взаимодействие; родительство и старение; практические рекомендации для специалистов.","why":"Научно-популярная книга клинического психолога Зои Соколовой об аутизме у взрослых без выраженных нарушений речи и интеллекта. Рассматривает современные диагностические критерии, особенности сенсорного восприятия, коммуникации, социального взаимодействия и эмоциональной регуляции; отдельно — аутизм у женщин, маскировка, поздняя диагностика, работа, дружба, близкие отношения и родительство. Сочетает обзор исследований с личным опытом аутичных людей. Полное название — «Аутизм у взрослых. Как он проявляется, зачем его диагностировать и что предпринять, чтобы стало жить легче» (Эксмо).","give":"Практическая сторона аутизма во взрослом возрасте, с материалами для специалистов; читается рядом с «Искателями закономерностей» Барон-Коэна — та же тема с научной стороны."},
{"t":"Искатели закономерностей","a":"Саймон Барон-Коэн","group":"have","cat":"popsci","toc":"9 глав. 1. Прирождённые искатели закономерностей 2. Механизм систематизации 3. Пять типов мозга 4. Ум изобретателя 5. Революция в мозге 6. Системная слепота: почему обезьяны не катаются на скейтборде 7. Битва гигантов 8. Секс в Долине 9. Забота об изобретателях будущего","why":"Британский психолог и исследователь аутизма Саймон Барон-Коэн связывает человеческую изобретательность со способностью распознавать закономерности и систематизировать информацию. Рассматривает когнитивные механизмы, позволяющие выявлять причинно-следственные связи и создавать технологии, систематизирующее мышление у аутичных людей, индивидуальные различия и эволюционные предпосылки изобретательности; опирается на психологию, нейронауку, археологию и исследования аутизма. Полное название — «Искатели закономерностей. Как аутизм способствует человеческой изобретательности» (Альпина нон-фикшн, 2023).","give":"Научный взгляд на аутизм как на особенность мышления. Это теория одного автора, а не общепринятый факт, поэтому читать критически."},
{"t":"Анатомия Неттера: атлас-раскраска. 2-е издание","a":"Джон Т. Хансен","group":"have","cat":"anatomy","badge":"Активное обучение","toc":"1. Остеология: череп, позвоночник, грудная клетка, кости конечностей. 2. Артрология: суставы и их типы. 3. Мышечная система по регионам: голова/шея, спина, грудь, живот, конечности. 4. Сердечно-сосудистая система: сердце, крупные сосуды, артерии и вены по регионам. 5. Лимфатическая система. 6. Нервная система: ЦНС (мозг, спинной мозг), ПНС (сплетения, периферические нервы), черепные нервы. 7. Дыхательная система: полость носа, гортань, трахея, лёгкие. 8. Пищеварительная система: от полости рта до толстого кишечника, печень, поджелудочная. 9. Мочевыделительная система. 10. Половая система (мужская и женская). 11. Эндокринная система: железы и их расположение. 12. Органы чувств: глаз, ухо. Каждая тема — разворот с контуром для раскрашивания и списком структур для подписи.","why":"Активное действие (раскрашивание) задействует моторную память в дополнение к зрительной — научно обоснованный метод.","give":"Мощная комбинация с Roosalu/Lepp: читаешь тему → закрепляешь раскраской. Использовать параллельно с систематическим изучением анатомии, не раньше."},
{"t":"Textbook of Medical Physiology (1st part)","a":"Guyton and Hall","group":"have","cat":"medbase","badge":"Фундамент медицины","toc":"Часть 1: 1. Клетка и общая физиология. 2. Мембранная физиология, нервы, мышцы. 3. Сердце. 4. Кровообращение. 5. Почки и жидкости тела. 6. Кровь, иммунитет, свёртывание. 7. Дыхание. Часть 2: 8. Физиология нервной системы (общая, специальные чувства). 9. Моторная и интегративная нейрофизиология (включая лимбическую систему, сон, мотивацию). 10. ЖКТ физиология. 11. Метаболизм и терморегуляция. 12. Эндокринология и репродукция. 13. Спортивная физиология.","why":"Золотой стандарт учебника физиологии человека — как работают все системы организма.","give":"Фундамент для всей дальнейшей медицины, включая нейрофизиологию и эндокринологию стресса, критичных для психиатрии. Требует базовой химии/биологии — не спеши, дождись этой базы."},
{"t":"Textbook of Medical Physiology (2nd part)","a":"Guyton and Hall","group":"have","cat":"medbase","badge":"Фундамент медицины","toc":"Часть 1: 1. Клетка и общая физиология. 2. Мембранная физиология, нервы, мышцы. 3. Сердце. 4. Кровообращение. 5. Почки и жидкости тела. 6. Кровь, иммунитет, свёртывание. 7. Дыхание. Часть 2: 8. Физиология нервной системы (общая, специальные чувства). 9. Моторная и интегративная нейрофизиология (включая лимбическую систему, сон, мотивацию). 10. ЖКТ физиология. 11. Метаболизм и терморегуляция. 12. Эндокринология и репродукция. 13. Спортивная физиология.","why":"Золотой стандарт учебника физиологии человека — как работают все системы организма.","give":"Фундамент для всей дальнейшей медицины, включая нейрофизиологию и эндокринологию стресса, критичных для психиатрии. Требует базовой химии/биологии — не спеши, дождись этой базы."},
{"t":"Inimese anatoomia","a":"Meeli Roosalu","group":"have","cat":"anatomy","badge":"Входная точка в анатомию","toc":"1. Rakud ja koed (клетки и ткани). 2. Luustik (скелет): kolju, selgroog, jäsemete luud. 3. Liigesed (суставы). 4. Lihased (мышцы) по регионам. 5. Süda ja veresooned (сердце и сосуды). 6. Hingamiselundid (дыхательные органы). 7. Seedeelundid (пищеварительные органы). 8. Kuseelundid (мочевые органы). 9. Suguelundid (половые органы). 10. Sisesekretsiooninäärmed (эндокринные железы). 11. Närvisüsteem (нервная система): kesknärvisüsteem, perifeerne närvisüsteem. 12. Meeleelundid (органы чувств): silm, kõrv.","why":"Компактный вводный эстонский учебник анатомии.","give":"Твоя входная точка в анатомию — короче и доступнее, чем Lepp, даёт общую карту тела до погружения в детали."},
{"t":"Inimese anatoomia. 1 osa","a":"Arne Lepp","group":"have","cat":"anatomy","badge":"Углублённый уровень","toc":"1. Sissejuhatus anatoomiasse (введение, анатомическая терминология). 2. Luustiku üldosa (общая остеология). 3. Kolju (череп): ajukolju, näokolju, kolju kui tervik. 4. Kere luud (кости туловища): selgroog, roided, rinnaku. 5. Ülajäseme luustik (кости верхней конечности). 6. Alajäseme luustik (кости нижней конечности). 7. Liigesteõpetus (артрология): kolju, kere, jäsemete liigesed. 8. Lihasteõpetus (миология): pea ja kaela lihased, kere lihased, jäsemete lihased.","why":"Более детальный и объёмный эстонский учебник анатомии.","give":"Основной, углублённый источник анатомических знаний на годы вперёд. Читать после Roosalu, не вместо него."},
{"t":"Inimese anatoomia. 2 osa","a":"Arne Lepp","group":"have","cat":"anatomy","badge":"Углублённый уровень","toc":"1. Seedeelundkond (пищеварительная система): suuõõs, neelu, söögitoru, magu, sooled, maks, kõhunääre. 2. Hingamiselundkond (дыхательная система): nina, kõri, hingetoru, kopsud. 3. Kuse-suguelundkond (мочеполовая система): neerud, kusejuhad, põis, sugunäärmed. 4. Südame-veresoonkond (сердечно-сосудистая система): süda, arterid, veenid, vereringed. 5. Lümfisüsteem (лимфатическая система). 6. Sisesekretsiooninäärmed (эндокринные железы). 7. Kesknärvisüsteem (ЦНС): seljaaju, ajutüvi, väikeaju, suuraju. 8. Perifeerne närvisüsteem (ПНС): kraniaalnärvid, seljaajunärvid, autonoomne närvisüsteem. 9. Meeleelundid (органы чувств).","why":"Вторая часть детального курса анатомии.","give":"Завершает систематический курс анатомии вместе с 1 osa."},
{"t":"Netter Atlas of Human Anatomy. Classic Regional Approach. 9th edition","a":"Frank H. Netter","group":"have","cat":"anatomy","badge":"Медицинский стандарт атласа","toc":"1. Голова и шея: череп, мозг, черепные нервы, лицо. 2. Позвоночник и спина. 3. Грудная клетка: сердце, лёгкие, средостение. 4. Живот: ЖКТ, печень, почки, забрюшинное пространство. 5. Таз и промежность. 6. Верхняя конечность: плечо, предплечье, кисть. 7. Нижняя конечность: бедро, голень, стопа. 8. Нейроанатомия отдельным разделом: спинной мозг, ствол, полушария. Каждый раздел содержит костные ориентиры, мышцы, сосуды, нервы послойно.","why":"Золотой стандарт медицинского анатомического атласа, используется в медвузах повсеместно.","give":"Апгрейд к уже имеющемуся Маккракену — точнее номенклатура, удобнее для быстрого поиска структуры. Справочник, не читается подряд."},
{"t":"Netter’s Anatomy Coloring Book. 4th edition","a":"John T. Hansen","group":"have","cat":"anatomy","badge":"Активное обучение","toc":"1. Остеология: череп, позвоночник, грудная клетка, кости конечностей. 2. Артрология: суставы и их типы. 3. Мышечная система по регионам: голова/шея, спина, грудь, живот, конечности. 4. Сердечно-сосудистая система: сердце, крупные сосуды, артерии и вены по регионам. 5. Лимфатическая система. 6. Нервная система: ЦНС (мозг, спинной мозг), ПНС (сплетения, периферические нервы), черепные нервы. 7. Дыхательная система: полость носа, гортань, трахея, лёгкие. 8. Пищеварительная система: от полости рта до толстого кишечника, печень, поджелудочная. 9. Мочевыделительная система. 10. Половая система (мужская и женская). 11. Эндокринная система: железы и их расположение. 12. Органы чувств: глаз, ухо. Каждая тема — разворот с контуром для раскрашивания и списком структур для подписи.","why":"Активное действие (раскрашивание) задействует моторную память в дополнение к зрительной — научно обоснованный метод.","give":"Мощная комбинация с Roosalu/Lepp: читаешь тему → закрепляешь раскраской. Использовать параллельно с систематическим изучением анатомии, не раньше."},
{"t":"Анатомия человека. 80 флеш карточек","a":"Р.П. Самусев","group":"have","cat":"anatomy","badge":"Вспомогательный тренажёр","toc":"Карточки распределены по системам: сердечно-сосудистая (сердце, крупные сосуды), нервная система (отделы мозга, черепные нервы, спинномозговые нервы), дыхательная система, мышечная система (основные группы мышц), органы чувств, эндокринные железы, соединения костей (суставы), пищеварительная система, мочевая и половые системы, органы иммунной защиты, костная система (отделы скелета), кожа и её производные. На каждой карточке — изображение структуры с одной стороны, название и краткое описание функции с другой.","why":"Инструмент интервального повторения для запоминания названий структур.","give":"Не источник знаний, а тренажёр для заучивания номенклатуры — использовать параллельно с Roosalu/Lepp, не вместо них."},
{"t":"Rutter’s Child and Adolescent Psychiatry and Psychology. 7th edition","a":"Wiley-Blackwell, 2025","group":"eu","cat":"psy","badge":"Горизонт: детская и подростковая психиатрия","toc":"<p class=\"toc-intro\">Четыре части. Это тематическое оглавление, а не перечень глав: точные названия, нумерация, авторы и страницы здесь не приводятся. Подтверждены только отдельно отмеченные названия (три раздела в Part III и четыре подраздела в Part IV); остальное — перечень основных тем части.</p><p class=\"toc-part\">Part I. Conceptual Issues and Research Approaches</p><p class=\"toc-intro\">Концептуальные вопросы и исследовательские подходы</p><p>В этой части рассматриваются:</p><ul><li>Развитие и психопатология на протяжении жизни (Development and psychopathology: a life course perspective)</li><li>Диагностика, диагностическая формулировка и классификация</li><li>Расстройства нейроразвития: концептуальные вопросы</li><li>Нарушения поведения: теоретические и исследовательские проблемы</li><li>Эмоции, эмоциональная регуляция и эмоциональные расстройства</li><li>Привязанность, темперамент и развитие</li><li>Нейробиологические подходы к психопатологии развития</li><li>Нейронаука и методы нейровизуализации</li><li>Исследование причинных связей, эпидемиология и статистические методы</li><li>Оценка эффективности вмешательств и организация помощи</li></ul><p class=\"toc-intro\">Основные темы части, а не точная нумерация глав.</p><p class=\"toc-part\">Part II. Influences on Psychopathology</p><p class=\"toc-intro\">Факторы, влияющие на развитие психопатологии</p><p>Биологические, психологические и средовые факторы:</p><ul><li>Генетика и эпигенетика</li><li>Неблагоприятные психосоциальные обстоятельства</li><li>Жестокое обращение и сексуальное насилие</li><li>Психические расстройства родителей и их влияние на развитие детей</li><li>Семейная среда и другие факторы риска</li><li>Взаимодействие биологических и социальных механизмов</li></ul><p class=\"toc-intro\">Особое значение имеют различия между фактором риска, корреляцией и установленной причинной связью.</p><p class=\"toc-part\">Part III. Approaching the Clinical Encounter</p><p class=\"toc-intro\">Подходы к клиническому обследованию и лечению</p><p>Практическая часть о работе с пациентами и семьями. Подтверждённые названия разделов:</p><ul><li>Use of structured interviews, rating scales — применение структурированных интервью и оценочных шкал</li><li>Psychological assessment in the clinical context — психологическое обследование в клинической практике</li><li>Physical examination and medical investigation — физикальное обследование и медицинские исследования</li></ul><p class=\"toc-intro\">Также рассматриваются клинические контексты, психологические вмешательства, семейная работа, когнитивно-поведенческая терапия и особенности помощи отдельным группам детей.</p><p class=\"toc-part\">Part IV. Clinical Syndromes: Neurodevelopmental, Emotional, Behavioral, Somatic/Body–Brain</p><p class=\"toc-intro\">Клинические синдромы: нейроразвитие, эмоциональные, поведенческие и соматические расстройства (четыре подраздела подтверждаются оглавлением 7-го издания)</p><ul><li><b>A. Neurodevelopmental — расстройства нейроразвития:</b> расстройства аутистического спектра, ADHD, нарушения интеллектуального развития, специфические расстройства обучения</li><li><b>B. Emotional — эмоциональные расстройства:</b> тревожные, депрессивные, биполярные и связанные со стрессом расстройства, в том числе посттравматическое стрессовое расстройство</li><li><b>C. Behavioral — поведенческие расстройства:</b> клинически значимые нарушения поведения и связанные с ними проблемы</li><li><b>D. Somatic/Body–Brain — соматические расстройства и взаимодействие мозга и тела:</b> состояния на пересечении психического и физического здоровья</li></ul><p class=\"toc-intro\">Сведения об издании и структура даны по присланному описанию и не сверены с самой книгой. Полный перечень глав смотри на странице издательства Wiley, в предварительном просмотре Google Books или на сопроводительном сайте учебника.</p>","why":"Крупное академическое руководство по психическому здоровью детей и подростков (по присланным данным — около 1120 страниц, ISBN 9781119906063, английский язык). Отличие от обычных учебников психиатрии — развитийный подход: расстройства рассматриваются не как набор диагностических симптомов, а как результат взаимодействия генетических, нейробиологических, психологических, семейных и социальных факторов на разных этапах развития. Объединяет клиническую психиатрию (диагностика, дифференциальная диагностика, коморбидность, течение, прогноз, лечение), психопатологию развития (возрастные изменения симптоматики, факторы риска и защиты, траектории развития), нейробиологию (генетика, развитие мозга, когнитивные и эмоциональные механизмы), клиническое обследование (интервью с ребёнком и родителями, психологическая оценка, шкалы) и лечение (психологические, семейные, социальные и медикаментозные вмешательства). Рассчитано на специалистов и предполагает знакомство с психиатрией, психологией и медицинской терминологией.","give":"Показывает, чем детская психиатрия отличается от взрослой, почему одинаковые симптомы значат разное в разном возрасте и как учитывать развитие при постановке диагноза. Начинать имеет смысл с диагностической формулировки, психопатологии развития и клинического обследования, затем переходить к РАС, ADHD, депрессивным и биполярным расстройствам. Эффективнее всего читать после освоения базовых разделов Oxford."}
];

const CATS = {
psy:"Психиатрия", neuro:"Неврология/нейронаука", "psych-gen":"Общая психология",
popsci:"Научпоп", psychotherapy:"Психотерапия (школы)", nonfiction:"Клинич. нон-фикшн",
fiction:"Худож. проза", anatomy:"Анатомия", medbase:"Медицинская база"
};
const GROUPS = {
  have:{icon:"✅",label:"Есть",hint:"Книги уже в библиотеке"},
  ru:{icon:"⏳",label:"Жду · Россия",hint:"Ожидаются из России"},
  eu:{icon:"⏳",label:"Жду · Европа",hint:"Ожидаются из Европы"}
};

const state = {group:null, cat:'all', q:''};
const $ = id => document.getElementById(id);

function plural(n,[one,few,many]){const m10=n%10,m100=n%100;return m10===1&&m100!==11?one:m10>=2&&m10<=4&&(m100<12||m100>14)?few:many;}
const books = n => n+' '+plural(n,['книга','книги','книг']);

// Нумерованное оглавление («1. … 2. …») показываем списком; вводный текст и «Часть N:» —
// отдельными строками. Если нумерация не идёт подряд, оставляем абзац как есть.
function numbered(t){
  const m = t.match(/(?<!Часть)(?:^|\s)(\d{1,2})\.\s/);
  if(!m) return null;
  const at = m.index + (m[0].length - m[0].trimStart().length);
  const items = t.slice(at).split(/(?<!Часть)\s(?=\d{1,2}\.\s)/);
  const nums = items.map(s=>+s.match(/^\d+/)[0]);
  if(items.length<3 || nums.some((n,k)=>n!==nums[0]+k)) return null;
  return {intro:t.slice(0,at).trim(), start:nums[0], items:items.map(s=>s.replace(/^\d{1,2}\.\s/,''))};
}
function tocHtml(t){
  if (/^\s*</.test(t)) return t; // готовая HTML-разметка
  return t.split(/\s(?=Часть \d+:\s)/).map(g=>{
    const part = g.match(/^Часть \d+:\s/);
    const n = numbered(part ? g.slice(part[0].length) : g);
    if(!n) return `<p>${g}</p>`;
    return (part?`<p class="toc-part">${part[0].replace(/:\s$/,'')}</p>`:'')
      + (n.intro?`<p class="toc-intro">${n.intro.replace(/:$/,'')}</p>`:'')
      + `<ol start="${n.start}">${n.items.map(i=>`<li>${i}</li>`).join('')}</ol>`;
  }).join('');
}

function matches(b, ignore){
  return (ignore==='group'||!state.group||b.group===state.group)
    && (ignore==='cat'||state.cat==='all'||b.cat===state.cat)
    && (!state.q||b.t.toLowerCase().includes(state.q)||b.a.toLowerCase().includes(state.q));
}

function renderStatus(){
  $('status').innerHTML = Object.entries(GROUPS).map(([k,g])=>{
    const n = DATA.filter(b=>b.group===k && matches(b,'group')).length;
    return `<button class="s-${k}" data-group="${k}" aria-pressed="${state.group===k}"><span class="eyebrow">${g.icon} ${g.label}</span><strong>${n}</strong><small>${n?g.hint:'Пока пусто'}</small></button>`;
  }).join('');
}

function renderChips(){
  const all = DATA.filter(b=>matches(b,'cat')).length;
  let html = `<button data-cat="all" aria-pressed="${state.cat==='all'}">Все темы<span>${all}</span></button>`;
  for(const [c,label] of Object.entries(CATS)){
    const n = DATA.filter(b=>b.cat===c && matches(b,'cat')).length;
    html += `<button data-cat="${c}" aria-pressed="${state.cat===c}">${label}<span>${n}</span></button>`;
  }
  $('chips').innerHTML = html;
}

function bookHtml(b,i){
  const meta = `<span class="book-meta">${b.badge?`<span class="badge">${b.badge}</span>`:''}<span class="book-cat">${CATS[b.cat]}</span></span>`;
  const head = `<span class="book-title">${b.t}</span>${b.a?`<span class="book-author">${b.a}</span>`:''}${meta}`;
  if(!b.toc) return `<li class="book s-${b.group}"><div class="book-static">${head}<span class="no-info">Описание пока не добавлено</span></div></li>`;
  return `
    <li class="book s-${b.group}">
      <button class="book-head" aria-expanded="false" aria-controls="b${i}">
        <span>${head}</span>
        <span class="chev" aria-hidden="true">▾</span>
      </button>
      <div class="book-body" id="b${i}" hidden>
        <div><h3>Оглавление / основные темы</h3><div class="toc">${tocHtml(b.toc)}</div></div>
        <div class="book-why">
          <div><h3>Зачем эта книга</h3><p>${b.why}</p></div>
          <div><h3>Что она даёт лично тебе</h3><p>${b.give}</p></div>
        </div>
      </div>
    </li>`;
}

function renderList(){
  const list = DATA.map((b,i)=>[b,i]).filter(([b])=>matches(b));
  $('count').textContent = list.length===DATA.length ? `Все ${books(DATA.length)}` : `Показано: ${books(list.length)} из ${DATA.length}`;
  $('reset').hidden = !(state.group||state.cat!=='all'||state.q);
  if(!list.length){$('list').innerHTML = '<li class="lib-empty">Ничего не найдено. Попробуй сбросить фильтры.</li>';return;}
  $('list').innerHTML = Object.entries(GROUPS).map(([k,g])=>{
    const items = list.filter(([b])=>b.group===k);
    if(!items.length) return '';
    return `<li class="group-head"><h2 class="group-title">${g.icon} ${g.label}<small>${books(items.length)}</small></h2></li>`+items.map(([b,i])=>bookHtml(b,i)).join('');
  }).join('');
}

function render(){renderStatus();renderChips();renderList();}

$('status').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  state.group = state.group===btn.dataset.group ? null : btn.dataset.group;
  render();
});
$('chips').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  state.cat = btn.dataset.cat; render();
});
$('search').addEventListener('input', e=>{state.q = e.target.value.trim().toLowerCase(); render();});
$('reset').addEventListener('click', ()=>{state.group=null;state.cat='all';state.q='';$('search').value='';render();});
$('list').addEventListener('click', e=>{
  const head = e.target.closest('.book-head'); if(!head) return;
  const open = head.getAttribute('aria-expanded')!=='true';
  head.setAttribute('aria-expanded', open);
  $(head.getAttribute('aria-controls')).hidden = !open;
});

{const n=g=>DATA.filter(b=>b.group===g).length;$('lede').textContent = `${books(DATA.length)}: ${n('have')} в наличии, ${n('ru') + n('eu')} в ожидании. У книг с описанием есть оглавление, пояснение, зачем нужна, и что она даёт лично тебе.`;}
render();
</script>
</body>
</html>
