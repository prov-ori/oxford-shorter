<style>
.nav-link[aria-current=page]{background:var(--tint)}
.lib{max-width:920px;margin:0 auto;padding:44px 40px 0}
.lib h1{font-size:44px}
.lib h1 em{color:#6e8a6c}
.lib-lede{max-width:600px;color:var(--muted);font-size:15px}
.lib-status{display:grid;grid-template-columns:repeat(3,1fr);margin:34px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.lib-status button{background:none;border-radius:0;text-align:left;padding:18px 20px 16px;border-left:1px solid var(--line);color:var(--ink);position:relative}
.lib-status button:first-child{border-left:0;padding-left:0}
.lib-status strong{display:block;font:400 34px/1.1 Georgia,serif;margin-top:6px}
.lib-status small{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.4}
.lib-status button[aria-pressed=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--dot)}
.lib-status button:first-child[aria-pressed=true]::after{left:0}
.lib-status button:hover{filter:none;background:var(--tint)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dot);margin-right:7px;vertical-align:1px}
.s-have{--dot:#3d7a5c}.s-ru{--dot:#c4924f}.s-eu{--dot:#6f8fb0}
.lib-tools{position:sticky;top:0;z-index:5;background:var(--paper);padding:18px 0 14px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.lib-tools .search{background:var(--surface)}
.lib-tools .search input{font-size:14px;outline:none}
.lib-tools .search:focus-within{border-color:var(--green);box-shadow:0 0 0 3px #bb835166}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink)}
.chips button span{color:var(--muted);margin-left:3px}
.chips button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.chips button[aria-pressed=true] span{color:#cfe0d6}
.lib-count{font-size:12px;color:var(--muted);margin:18px 0 0;display:flex;justify-content:space-between;gap:12px}
.lib-count button{background:none;padding:0;color:var(--green);font-weight:600;font-size:12px}
.books{list-style:none;padding:0;margin:0}
.book{border-bottom:1px solid var(--line)}
.book-head{display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:start;width:100%;background:none;border-radius:0;text-align:left;color:var(--ink);padding:20px 0}
.book-head:hover{filter:none}
.book-head:hover .book-title{color:var(--green)}
.book-title{font:400 21px/1.3 Georgia,serif;display:block}
.book-author{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.book-meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:9px;font-size:12px}
.book-meta .badge{background:none;padding:0;font-size:12px;white-space:normal;color:var(--ink)}
.book-cat{color:var(--muted)}
.chev{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:transform .2s;font-size:13px;margin-top:2px}
.book-head[aria-expanded=true] .chev{transform:rotate(180deg);background:var(--tint)}
.book-body{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;padding:2px 0 28px}
.book-body[hidden]{display:none}
.book-body h3{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:10px}
.book-body p{margin:0;font-size:14px;line-height:1.7}
.book-why{display:grid;gap:22px;align-content:start}
.book-why>div{border-left:2px solid var(--line);padding-left:16px}
.toc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;font-size:13.5px;line-height:1.65}
.toc ol,.toc ul{margin:0;padding-left:22px}
.toc li{padding:2px 0}
.toc p+p,.toc ol+p,.toc ul+p{margin-top:12px}.toc ul+p{margin-bottom:0}
.toc .toc-part{font-weight:600}
.toc .toc-intro{color:var(--muted);margin-bottom:10px}
.toc li::marker{color:var(--muted);font-size:12px}
.toc a{font-weight:600}
.group-head{list-style:none}
.group-title{font:400 24px/1.3 Georgia,serif;margin:34px 0 0;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.group-title small{font:12px/1 'Segoe UI',Arial,sans-serif;color:var(--muted);margin-left:8px}
.book-static{padding:20px 0}
.book-static .book-meta{margin-top:9px}
.no-info{display:block;color:var(--muted);font-size:12px;margin-top:8px}
.lib-empty{padding:40px 0;text-align:center;color:var(--muted)}
.lib footer{margin-top:40px}
@media(max-width:850px){.lib{padding:30px 26px 0}.lib h1{font-size:36px}.book-body{grid-template-columns:1fr;gap:22px}}
@media(max-width:580px){.top-actions{gap:0}.top-actions .nav-link{padding:9px 6px}.lib{padding:22px 16px 0}.lib h1{font-size:30px;letter-spacing:-.8px}
.lib-status button{padding:14px 10px 12px}.lib-status strong{font-size:28px}.lib-status small{display:none}.lib-status .eyebrow{font-size:9px;letter-spacing:1px}
.lib-tools{padding:12px 0 10px}.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.chips button{flex:none}
.book-title{font-size:19px}}
@media(prefers-reduced-motion:reduce){.chev{transition:none}}

@media(max-width:850px){.lib-tools input{font-size:16px!important}.chips button{min-height:44px;padding:8px 12px}.lib-count{align-items:flex-start;flex-wrap:wrap}.lib-count button{min-height:44px}.book-body,.book-head>span:first-child{min-width:0}.book-title,.toc,.book-body p{overflow-wrap:anywhere}.book-meta .badge{font-size:13px}}
</style>
</head>

const DATA = [
{"cat":"neuro","t":"Neuroscience","a":"Purves","group":"eu","badge":"Нейронаука: от клетки к поведению","why":"Учебник по устройству и работе нервной системы: от электрических и химических сигналов нейронов до сенсорных систем, управления движением, развития мозга и когнитивных функций. Связывает клеточные механизмы с поведением и клиническими примерами. Описание курса — <a href=\"https://learninglink.oup.com/access/purves7xe\" target=\"_blank\" rel=\"noopener noreferrer\">Oxford University Press</a>.","give":"Помогает понимать биологические механизмы восприятия, памяти и эмоций при чтении Oxford и Fish. Подходит для последовательного изучения нейронауки; клиническую психиатрию дополняет объяснением работы нервной системы.","toc":"<p>Оглавление 7-го издания, 33 главы (ISBN 9780197616246). Издание подтверждено владельцем библиотеки. Ниже русский перевод заголовков, а не перевод самой книги.</p><p class=\"toc-part\">Введение</p><ol start=\"1\"><li>Изучение нервной системы</li></ol><p class=\"toc-part\">I. Передача сигналов в нервной системе</p><ol start=\"2\"><li>Электрические сигналы нервных клеток</li><li>Потенциал-зависимая проницаемость мембраны</li><li>Ионные каналы и транспортёры</li><li>Синаптическая передача</li><li>Нейромедиаторы и их рецепторы</li><li>Внутринейронная молекулярная сигнализация</li><li>Синаптическая пластичность</li></ol><p class=\"toc-part\">II. Ощущения и обработка сенсорной информации</p><ol start=\"9\"><li>Зрение</li><li>Слух</li><li>Вестибулярная система</li><li>Осязание и проприоцепция</li><li>Боль и температура</li><li>Обоняние</li><li>Вкус</li></ol><p class=\"toc-part\">III. Движение и его центральное управление</p><ol start=\"16\"><li>Цепи нижних мотонейронов и управление движением</li><li>Управление стволом и спинным мозгом верхними мотонейронами</li><li>Модуляция движений базальными ганглиями</li><li>Модуляция движений мозжечком</li><li>Движения глаз и сенсомоторная интеграция</li><li>Висцеральная двигательная система</li></ol><p class=\"toc-part\">IV. Изменяющийся мозг</p><ol start=\"22\"><li>Раннее развитие мозга</li><li>Формирование нейронных цепей</li><li>Пластичность развивающегося мозга под влиянием опыта</li><li>Половые различия и развитие нейронных цепей</li><li>Восстановление и регенерация нервной системы</li></ol><p class=\"toc-part\">V. Сложные функции мозга и когнитивная нейронаука</p><ol start=\"27\"><li>Когнитивные функции и организация коры</li><li>Состояния коры</li><li>Внимание</li><li>Память</li><li>Речь и язык</li><li>Эмоции</li><li>Мышление, планирование и принятие решений</li></ol><p>Источник: <a href=\"https://www.oup.com.au/books/higher-education/science/9780197616246\" target=\"_blank\" rel=\"noopener noreferrer\">оглавление OUP, 7-е издание</a>. В каталоге у главы «Память» опечатка в номере; здесь сохранена последовательная нумерация 30.</p>"},
{"cat":"neuro","t":"Netter’s Coloring Book of Neuroscience. 2th edition","a":"David L. Felten и Mary Summo Maida","group":"eu","badge":"Атлас-раскраска · 2-е издание","why":"Учебная раскраска по нейроанатомии, функциям нервной системы и неврологическим нарушениям. Более 145 тем представлены рисунками на основе иллюстраций Неттера, заданиями на выделение структур и пояснениями их функционального и клинического значения. Официальное название — Netter’s Neuroscience Coloring Book; 2-е издание, ISBN 9780443117312.","give":"Позволяет активно разбирать расположение структур и ход проводящих путей: читать тему, отмечать её на рисунке и проверять понимание вопросами. Удобна рядом с Purves и атласом нейронауки Неттера.","toc":"<p>Четыре раздела, 12 глав. Русский перевод заголовков издательского оглавления.</p><p class=\"toc-part\">I. Обзор нервной системы</p><ol start=\"1\"><li>Нейроны и их свойства</li><li>Головной мозг, череп и мозговые оболочки</li><li>Ствол мозга, мозжечок и спинной мозг</li><li>Желудочки, спинномозговая жидкость и сосудистая система</li></ol><p class=\"toc-part\">II. Региональная нейронаука</p><ol start=\"5\"><li>Периферическая нервная система</li><li>Спинной мозг</li><li>Ствол мозга и мозжечок</li><li>Передний мозг: промежуточный и конечный мозг</li></ol><p class=\"toc-part\">III. Системная нейронаука</p><ol start=\"9\"><li>Сенсорные системы</li><li>Двигательные системы</li><li>Вегетативные, гипоталамические и лимбические системы</li></ol><p class=\"toc-part\">IV. Общие функции мозга</p><ol start=\"12\"><li>Общие функции мозга и их нарушения</li></ol><p>После первых трёх разделов — вопросы и ответы; выполненные упражнения доступны онлайн. Источник описания и оглавления: <a href=\"https://www.educate.elsevier.com/book/details/9780443117312\" target=\"_blank\" rel=\"noopener noreferrer\">Elsevier, 2-е издание</a>.</p>"},
{"cat":"neuro","t":"Netter’s Atlas of Neuroscience. 5th edition","a":"David L. Felten, Michael K. O’Banion, Mary Summo Maida","group":"eu","badge":"Нейроанатомический атлас · 5-е издание","why":"Иллюстрированный атлас нервной системы для изучения нейроанатомии и нейронауки. Рассматривает строение нейронов, отделы центральной и периферической нервной системы, сенсорные и двигательные системы и общие функции мозга. Соединяет базовые понятия с клиническими пояснениями; 5-е издание, ISBN 9780443380532.","give":"Помогает соотносить функции с конкретными структурами и проводящими путями. Используй как визуальный справочник к Purves и для проверки анатомических связей при изучении неврологических и психиатрических тем.","toc":"<p>17 глав по опубликованному оглавлению 5-го издания. Повторение спинного мозга и ствола с мозжечком отражает разные главы исходника.</p><p class=\"toc-part\">Главы</p><ol start=\"1\"><li>Нейроны и их свойства</li><li>Череп и мозговые оболочки</li><li>Головной мозг</li><li>Ствол мозга и мозжечок</li><li>Спинной мозг</li><li>Желудочки и спинномозговая жидкость</li><li>Сосудистая система</li><li>Нейронаука развития</li><li>Периферическая нервная система</li><li>Спинной мозг</li><li>Ствол мозга и мозжечок</li><li>Промежуточный мозг</li><li>Конечный мозг</li><li>Сенсорные системы</li><li>Двигательные системы</li><li>Вегетативные, гипоталамические и лимбические системы</li><li>Общие функции мозга</li></ol><p>Источник описания и оглавления: <a href=\"https://evolve.elsevier.com/cs/product/9780443380532?role=student\" target=\"_blank\" rel=\"noopener noreferrer\">Elsevier Evolve, 5-е издание</a>.</p>"},
{"t":"Основы психофармакологии","a":"Стивен М. Стал","group":"ru","cat":"psy","badge":"Медвуз, приоритет №3","toc":"1. Химические посредники: нейротрансмиттеры, рецепторы, сигнальные каскады, G-белки. 2. Синапс и принципы нейропередачи. 3. Антидепрессанты: SSRI, SNRI, трициклики, MAOI, атипичные — механизмы и различия. 4. Антипсихотики: типичные vs атипичные, D2-блокада, серотонин-дофаминовая гипотеза шизофрении. 5. Стабилизаторы настроения: литий, вальпроаты, ламотриджин — механизмы при биполярном расстройстве. 6. Анксиолитики: бензодиазепины, буспирон, GABA-система. 7. Снотворные и хронобиология сна. 8. Психостимуляторы и лечение СДВГ. 9. Психофармакология деменции. 10. Особые популяции: беременность, пожилой возраст, дети. 11. Фармакогенетика и персонализированная психофармакология.","why":"Не таблицы дозировок (это Prescriber's Guide), а именно механизмы — почему конкретный препарат работает на нейрохимическом уровне.","give":"Oxford скажет 'при депрессии используют SSRI'. Stahl объяснит, почему именно SSRI и что происходит в синапсе."},
{"t":"Психиатрия и медицинская психология","a":"Н.Н. Иванец, Ю.Г. Тюльпин, М.А. Кинкулькина","group":"ru","cat":"psy","badge":"Дублирует Oxford","toc":"1. Общая психопатология: расстройства ощущений, восприятия, памяти, мышления, эмоций, воли, сознания. 2. Методы обследования психиатрического больного. 3. Шизофрения и расстройства шизофренического спектра. 4. Аффективные расстройства (депрессия, мания, биполярное). 5. Невротические, связанные со стрессом расстройства (неврозы, ПТСР, ОКР). 6. Расстройства личности (психопатии). 7. Умственная отсталость. 8. Органические психические расстройства (деменции, экзогенно-органические психозы). 9. Эпилепсия и психические нарушения при ней. 10. Наркология: алкоголизм, наркомании, токсикомании. 11. Детская и подростковая психиатрия. 12. Судебная психиатрия и вопросы дееспособности. 13. Основы медицинской психологии: психология больного, деонтология, психосоматика. 14. Организация психиатрической помощи в РФ, законодательство.","why":"Российский учебник, построен под российскую номенклатуру и организацию здравоохранения, местами расходится с ICD-11 и европейской практикой.","give":"Дублирует функцию Oxford, но под другую систему здравоохранения, которая не твоя. Не приоритет — Oxford для твоего контекста ценнее."},
{"t":"Клиническое интервью","a":"Джон, Рита Соммерз-Фланаган","group":"ru","cat":"psy","badge":"Горизонт резидентуры","toc":"1. Основы и этика клинического интервью. 2. Слушание и построение раппорта. 3. Невербальная коммуникация в интервью. 4. Структура интервью: открытие, основная часть, завершение. 5. Техники опроса: открытые/закрытые вопросы, отражение, прояснение. 6. Оценка психического статуса (Mental Status Exam). 7. Сбор анамнеза: история болезни, семейный анамнез, социальный анамнез. 8. Оценка суицидального риска и риска насилия. 9. Работа с сопротивлением и трудными клиентами. 10. Интервью с детьми и подростками. 11. Интервью с парами и семьями. 12. Мультикультурная компетентность в интервью. 13. Особые популяции: пожилые, люди с ограниченными возможностями. 14. Постановка диагноза и написание заключения.","why":"Практический навык ведения психиатрического/психологического интервью — не теория, а техника разговора с пациентом.","give":"Полезно, но требует реальной практики с пациентами для закрепления. Читать без клинического контекста — как учить плавать по книге. Отложи до практики/резидентуры."},
{"t":"Наркология. Национальное руководство","a":"Н. Н. Иванец","group":"ru","cat":"psy","toc":"<p>Справочное оглавление: 3-е издание, ГЭОТАР-Медиа, 2024, ISBN 978-5-9704-8363-3; 18 глав. Год твоего экземпляра пока не указан — структура прежних изданий отличается. Названия сокращены для навигации.</p><ol start=\"1\"><li>Распространённость наркологических заболеваний</li><li>Устройство наркологической службы</li><li>Биологические основы формирования зависимости</li><li>Действие и токсичность психоактивных веществ</li><li>Генетика ответа на лечение зависимостей</li><li>Симптомы и синдромы в наркологии</li><li>Систематика наркологических расстройств</li><li>Клиника употребления веществ и поведенческих зависимостей</li><li>Соматические и неврологические осложнения</li><li>Сопутствующие психические расстройства</li><li>Различия по возрасту и полу</li><li>Медикаментозная терапия зависимостей</li><li>Психотерапевтические подходы в наркологии</li><li>Восстановление и реабилитационные программы</li><li>Предупреждение наркологических заболеваний</li><li>Выявление употребления веществ</li><li>Законодательство и профессиональная этика</li><li>Шкалы для клинической оценки</li></ol><p><a href=\"https://www.geotar.ru/cgi-bin/unishell?hide_Cookie=yes&usr_data=open%28lots%2CNF0027593%2Cattaches%2C%2C2%2Cf1%2C%2C00000000%2C%29\" target=\"_blank\" rel=\"noopener noreferrer\">Официальное оглавление ГЭОТАР-Медиа (PDF)</a></p>","why":"Медицинское руководство по болезням зависимости: от эпидемиологии и биологических механизмов до диагностики, лечения, психотерапии, реабилитации и профилактики. Рассматривает употребление разных веществ, поведенческие зависимости, сопутствующие психические нарушения и соматические осложнения. Адресовано прежде всего врачам и учащимся медицинских специальностей. Издания 2008, 2016 и 2024 годов и краткая версия 2020 года различаются; здесь приведена проверенная структура полного издания 2024 года.","give":"Справочник, а не книга для чтения подряд. Дополняет главу Oxford о злоупотреблении алкоголем и психоактивными веществами российской клинической практикой."},
{"t":"Основы доказательной медицины","a":"Триша Гринхальх","group":"ru","cat":"medbase","toc":"<p>Справочное оглавление: 6-е русское издание, перевод 7-го английского; 20 глав. Издание твоего экземпляра ещё не подтверждено. Названия сокращены для навигации.</p><ol start=\"1\"><li>Задачи критического чтения публикаций</li><li>Поиск научных источников</li><li>Определение предмета и дизайна статьи</li><li>Проверка качества методологии</li><li>Понимание статистического анализа</li><li>Испытания простых медицинских вмешательств</li><li>Испытания комплексных вмешательств</li><li>Проверка диагностических и скрининговых методов</li><li>Обобщение исследований и метаанализ</li><li>Оценка клинических руководств</li><li>Экономическая оценка медицинской помощи</li><li>Анализ качественных исследований</li><li>Публикации об опросах</li><li>Исследования повышения качества помощи</li><li>Генетические ассоциации в исследованиях</li><li>Применение доказательств вместе с пациентом</li><li>Исследования ИИ в медицине</li><li>Роль доказательств механизмов действия</li><li>Методы выработки экспертного согласия</li><li>Ограничения доказательного здравоохранения</li></ol><p><a href=\"https://www.geotar.ru/cgi-bin/unishell?hide_Cookie=yes&usr_data=open%28lots%2CNF0035080%2Cattaches%2C%2C2%2Cf1%2C%2C00000000%2C%29\" target=\"_blank\" rel=\"noopener noreferrer\">Официальное оглавление и фрагмент ГЭОТАР-Медиа (PDF)</a></p><p>Приложения: контрольные списки поиска и оценки доказательств; оценка эффектов вмешательства. Предметный указатель.</p>","why":"Практический учебник критического чтения медицинских исследований: поиск литературы, выбор дизайна, риск систематических ошибок, статистика и клиническая применимость. Разбирает испытания, диагностические тесты, обзоры, рекомендации, экономические и качественные исследования. В новом справочном издании добавлены ИИ, механистические доказательства и экспертный консенсус. Помогает оценивать основания вывода, а не только его убедительность; версия твоей книги требует уточнения.","give":"База для критического чтения исследований, в том числе тех, на которые опирается Oxford (в нём есть глава о доказательных подходах в психиатрии). Учит задавать статье вопросы, а не принимать вывод на веру."},
{"t":"Shorter Oxford Textbook of Psychiatry. 8th edition","a":"Harrison, Cowen, Bhui, Fazel","group":"have","cat":"psy","badge":"Медвуз, приоритет №1","toc":"26 глав (по сверенному оглавлению PDF; учебный перевод — <a href=\"./\">на главной странице этого сайта</a>): 1. Признаки и симптомы психических расстройств. 2. Классификация. 3. Психиатрическое обследование. 4. Этика и гражданское право. 5. Этиология. 6. Доказательные подходы в психиатрии. 7. Реакции на стрессовые переживания. 8. Тревожные и обсессивно-компульсивные расстройства. 9. Депрессия. 10. Биполярное расстройство. 11. Шизофрения. 12. Параноидные симптомы и синдромы. 13. Расстройства пищевого поведения, сна и бодрствования и сексуальные расстройства. 14. Деменция, делирий и другие нейропсихиатрические расстройства. 15. Личность и расстройства личности. 16. Детская и подростковая психиатрия. 17. Расстройства интеллектуального развития. 18. Судебная психиатрия. 19. Психиатрия пожилого возраста. 20. Злоупотребление алкоголем и психоактивными веществами. 21. Самоубийство и самоповреждение. 22. Психиатрия и медицина. 23. Общественное и глобальное психическое здоровье. 24. Психологические методы лечения. 25. Лекарственные средства и другие физические методы лечения. 26. Психиатрические службы. Перевод: главы 1–19 полностью; в главе 19 сохранены все 7 разделов, 4 таблицы и 5 вставок. Глава 20 полностью переведена: алкоголь и другие вещества, профилактика, диагностика, лечение, реабилитация и рекомендуемая литература. Глава 21 полностью переведена, PDF 598–617, включая ведение после самоповреждения и рекомендуемую литературу. Глава 22 «Психиатрия и медицина»: все 7 разделов готовы, PDF 618–653 — введение, дуализм, телесный дистресс, хроническая боль и диссоциативные расстройства; сохранены таблицы 22.1–22.2 и вставки 22.1–22.3. Несогласованности классификационной таблицы отмечены отдельно. Раздел о психических расстройствах в общемедицинской практике завершён, PDF 625–637, включая искусственно вызываемые расстройства, симуляцию и телесное дисморфическое расстройство; таблицы 22.3–22.4 и вставки 22.4–22.10. Раздел служб психологической медицины завершён, PDF637–647, включая инфекции, COVID-19, онкологию, генетическое консультирование и травмы; вставки22.11–22.12 сохранены. Последний раздел завершён: беременность, послеродовые расстройства и гинекология. В главе сохранены все 13 вставок и четыре таблицы. Далее — глава23.","why":"Главная карта специальности. Построен под ICD — систему, по которой будешь практиковать в Европе (в отличие от Kaplan&Sadock/DSM).","give":"Даёт целостную картину: что вообще входит в психиатрию, как выглядит каждое расстройство клинически. Без этого всё остальное (Stahl, Fish, Blumenfeld) — разрозненные фрагменты без каркаса."},
{"t":"Fish’s Clinical Psychopathology. 5th edition","a":"Patricia Casey, Brendan Kelly","group":"have","cat":"psy","badge":"Русский перевод: главы 1–10 полностью, оба приложения и указатель","toc":"<p><a href=\"fish.html\">Открыть русский учебный перевод →</a></p><p>По оглавлению загруженного PDF: 1. Классификация психических расстройств. 2. Что такое психопатология? Споры о классификации психических расстройств. 3. Расстройства восприятия. 4. Расстройства мышления и речи. 5. Расстройства памяти. 6. Расстройства эмоций. 7. Расстройства переживания собственного «я». 8. Двигательные расстройства. 9. Расстройства сознания. 10. Расстройства личности. Приложение I: психиатрические синдромы. Приложение II: защиты и искажения. Указатель.</p><p>Новая читаемая версия PDF содержит152 страницы. Титульные и издательские страницы, оглавление, предисловие, главы 1–10, оба приложения и указатель полностью переведены.</p>","why":"Не про расстройства целиком, а про точное описание отдельных симптомов — язык психиатрической диагностики.","give":"Учит разницу между апатией и ангедонией, истинной и псевдогаллюцинацией. Без этого точного словаря клиническое наблюдение остаётся расплывчатым.","aliases":["Фиш","Клиническая психопатология Фиша"]},
{"cat":"psychotherapy","t":"Мотивационное консультирование","a":"Уильям Р. Миллер, Стивен Роллник","group":"have","badge":"Разговор об изменениях · 4-е издание","why":"Руководство Миллера и Роллника о поддержке собственной мотивации человека к изменениям с уважением к его автономии. Четвёртое издание переработано: рассматривает углублённое слушание, работу с изменяющими высказываниями, предоставление информации и советов, амбивалентность и разногласия, освоение метода в практике. Описание русского издания — <a href=\"https://eksmo.ru/amp/book/motivatsionnoe-konsultirovanie-pomoshch-lyudyam-v-izmenenii-i-roste-4-e-izdanie-ITD1435663/\" target=\"_blank\" rel=\"noopener noreferrer\">Эксмо / БОМБОРА</a>.","give":"Дополняет навыки клинического интервью работой с амбивалентностью и поддержкой автономии человека. Помогает анализировать собственные вопросы, отражения и реакции в беседе; освоение навыка требует практики и обратной связи.","toc":"<p>Оглавление 4-го издания, подтверждённого владельцем: четыре части, 18 глав. Оригинал — Helping People Change and Grow (ISBN 9781462552795). Ниже русский перевод заголовков английского оригинала; формулировки русскоязычного издания могут отличаться.</p><p class=\"toc-part\">I. Помощь людям в изменении и росте</p><ol start=\"1\"><li>Разум и сердце в оказании помощи</li><li>Что такое мотивационное консультирование?</li><li>Свободно текущая беседа</li></ol><p class=\"toc-part\">II. Практика мотивационного консультирования</p><ol start=\"4\"><li>Вовлечение: «Можем ли мы идти вместе?»</li><li>Фокусирование: «Куда мы идём?»</li><li>Извлечение: «Зачем тебе туда идти?»</li><li>Планирование: «Как ты туда доберёшься?»</li></ol><p class=\"toc-part\">III. Углублённое изучение мотивационного консультирования</p><ol start=\"8\"><li>Углублённое слушание</li><li>Фокусирование: углублённое рассмотрение</li><li>Извлечение: развитие изменяющих высказываний</li><li>Предоставление информации и советов</li><li>Поддержка настойчивости</li><li>Посев семян</li><li>Ответ на сохраняющие высказывания и разногласия</li><li>Качественная практика</li></ol><p class=\"toc-part\">IV. Обучение и исследование мотивационного консультирования</p><ol start=\"16\"><li>Обучение мотивационному консультированию</li><li>Обучение на беседах об изменениях</li><li>Исследование мотивационного консультирования</li></ol><p>Предисловие к четвёртому изданию, глоссарий понятий и указатель. Источник оглавления: <a href=\"https://www.guilford.com/books/Motivational-Interviewing/Miller-Rollnick/9781462552795/contents\" target=\"_blank\" rel=\"noopener noreferrer\">Guilford Press, 4-е издание</a>.</p>"},
{"t":"Тайны нашего мозга","a":"Сандра Амодт, Сэм Вонг","group":"have","cat":"popsci","toc":"6 частей и 31 глава. Часть 1: Ваш мозг и окружающий мир 1. Можно ли доверять своему мозгу? 2. Серое вещество мозга и киноэкран 3. Мыслящее мясо: нейроны и синапсы 4. Удивительные ритмы: биологические часы 5. Примерьте купальник: регулирование веса Часть 2: Органы чувств 6. Рассматривая себя: зрение 7. Как пережить вечеринку: слух 8. О вкусах не спорят (и о запахах) 9. Касаясь основ: осязание Часть 3: Как меняется наш мозг на протяжении жизни 10. Растим вундеркинда: раннее детство 11. Развитие ребёнка: сенситивные периоды и язык 12. Бунты и их причины: детство и подростковый возраст 13. Образовательный тур: обучение 14. Восхождение на вершину горы: старение 15. Продолжается ли в наши дни эволюция мозга? Часть 4: Ваш эмоциональный мозг 16. Стихия мозга: эмоции 17. Тревожность 18. Счастье и как его найти 19. Что там внутри? Личность 20. Пол, любовь и образование пар Часть 5: Ваш рациональный мозг 21. Как принять решение 22. Интеллект (и его недостаток) 23. Наш фотоальбом: память 24. Рациональность без причины: аутизм 25. Разница в когнитивных процессах между полами Часть 6: Изменённые состояния сознания 26. Изучение сознания 27. Что нам снится: нейробиология сна 28. Паломничество: духовное начало 29. Инсульт 30. Наркотики и алкоголь 31. Виды глубинной терапии мозга","why":"Научно-популярная книга о том, как мозг воспринимает мир, управляет поведением, принимает решения и иногда вводит нас в заблуждение. Нейробиологи Сандра Амодт и Сэм Вонг объясняют механизмы памяти, эмоций, обучения, сна, сознания и работы органов чувств, разбирают распространённые представления о мозге и показывают, какие из них подтверждаются исследованиями. Полное название — «Тайны нашего мозга, или Почему умные люди делают глупости»; оригинал — «Welcome to Your Brain» (2008).","give":"Лёгкий вход в нейробиологию перед Лурией: объясняет, почему люди ошибаются и как меняются когнитивные способности с возрастом. Не клинический учебник."},
{"t":"Основы общей психологии","a":"Сергей Рубинштейн","group":"have","cat":"psych-gen","badge":"Трек Б, дублирует","toc":"1. Предмет психологии и её задачи. 2. Методы психологии. 3. История развития психологии как науки. 4. Развитие психики в филогенезе. 5. Развитие поведения и психики животных. 6. Проблема сознания. 7. Деятельность (структура, виды). 8. Ощущение. 9. Восприятие (свойства, виды, восприятие пространства/времени/движения). 10. Память (виды, процессы запоминания, забывание). 11. Воображение. 12. Мышление и речь. 13. Внимание. 14. Эмоции и чувства. 15. Воля. 16. Темперамент и характер. 17. Способности. 18. Личность: направленность, самосознание.","why":"Классический советский учебник общей психологии, тяжеловесный академический стиль.","give":"Общая эрудиция для будущего психотерапевтического обучения. У тебя уже 2-3 похожих книги (Гиппенрейтер, Лурия-лекции) — избыточность, не читай все подряд."},
{"t":"Лекции по общей психологии","a":"А. Р. Лурия","group":"have","cat":"psych-gen","badge":"Трек Б, пара с Выготским","toc":"1. Предмет психологии, её место среди наук. 2. Психология и мозг: проблема локализации функций. 3. Ощущения: виды, законы психофизики. 4. Восприятие: константность, предметность, категориальность. 5. Внимание: непроизвольное и произвольное, нейрофизиология внимания. 6. Память: виды, процессы, нарушения памяти. 7. Эмоции: физиологические основы, теории эмоций. 8. Речь и мышление: развитие понятий, внутренняя речь. 9. Движения и действия: произвольная регуляция. 10. Личность: культурно-историческая концепция развития.","why":"Изложение общей психологии в русле школы Выготского, автор которой лично соавтор Выготского.","give":"Логично читать рядом с 'Мышление и речь' Выготского — одна теоретическая традиция, усиливают друг друга."},
{"t":"Психология развития","a":"Грэйс Крайг, Дон Бокум","group":"have","cat":"psych-gen","badge":"Трек Б, закрывает реальный пробел","toc":"1. Основы теории развития (Пиаже, Эриксон, Выготский, этология). 2. Наследственность и пренатальное развитие. 3. Рождение и период новорождённости. 4. Физическое и когнитивное развитие в младенчестве. 5. Психосоциальное развитие младенца (привязанность). 6. Раннее детство: физическое, когнитивное, психосоциальное развитие. 7. Среднее детство (школьный возраст): развитие интеллекта, Я-концепции, отношения со сверстниками. 8. Подростковый возраст: пубертат, идентичность, отношения с родителями. 9. Ранняя взрослость: карьера, близкие отношения. 10. Средняя взрослость: кризис среднего возраста, семья. 11. Поздняя взрослость: старение, когнитивные изменения. 12. Смерть, умирание и утрата.","why":"Единственная книга в общем психологическом блоке про конкретно возрастную динамику — остальные фокусируются на когнитивных процессах.","give":"Критично для будущей практики: отличать возрастную норму от патологии, понимать детскую/подростковую и гериатрическую психиатрию."},
{"t":"Социальная психология","a":"Дэвид Майерс","group":"have","cat":"psych-gen","badge":"Трек Б, расширяет Чалдини","toc":"1. Введение в социальную психологию: методы исследования. 2. Я в социальном мире: самооценка, самоэффективность, локус контроля. 3. Социальные убеждения и суждения: атрибуция, самоисполняющиеся пророчества. 4. Установки и поведение. 5. Сила ситуации: конформность, подчинение авторитету (Милгрэм), эффект свидетеля. 6. Убеждение: элементы, маршруты убеждения. 7. Групповое влияние: социальная фасилитация, огруппление мышления, деиндивидуация. 8. Предрассудки: природа, причины, последствия. 9. Агрессия: теории, влияющие факторы. 10. Привлекательность и близкие отношения: любовь, привязанность. 11. Просоциальное поведение (альтруизм). 12. Конфликт и примирение.","why":"Академичнее и шире, чем уже имеющийся Чалдини (который фокусируется только на убеждении).","give":"Понимание социального контекста поведения пациента — не клинический навык напрямую, но полезный фон мышления."},
{"t":"Основы нейропсихологии","a":"А. Р. Лурия","group":"have","cat":"neuro","badge":"Можно читать уже сейчас","toc":"1. Мозг как субстрат психической деятельности — три функциональных блока мозга (по Лурии). 2. Проблема локализации высших психических функций. 3. Нарушения при поражении затылочных отделов (зрительные агнозии). 4. Нарушения при поражении теменных отделов (соматосенсорные расстройства, апраксии). 5. Нарушения при поражении височных отделов (слуховые агнозии, афазии — сенсорная, акустико-мнестическая). 6. Нарушения при поражении лобных долей (регуляция поведения, лобный синдром, персеверации). 7. Нарушения памяти при разных локализациях. 8. Методы нейропсихологической диагностики (батарея Лурии).","why":"Классический труд основателя нейропсихологии — реальные клинические наблюдения связи мозг-поведение.","give":"Прямое попадание в твой интерес к нейропсихиатрии. Не требует медицинской базы, можно читать уже сейчас."},
{"t":"Психология стресса","a":"Роберт Сапольски","group":"have","cat":"popsci","badge":"Можно читать уже сейчас","toc":"1. Что такое стресс: эволюционная логика реакции 'бей или беги'. 2. Стресс и сердечно-сосудистая система (гипертония, атеросклероз). 3. Стресс и энергетический метаболизм. 4. Стресс, пищеварение и язвы. 5. Стресс и рост (влияние на детей). 6. Стресс и иммунная система. 7. Стресс, боль и память. 8. Стресс и сон. 9. Стресс и старение. 10. Стресс и депрессия — ось HPA и кортизол. 11. Личность, характер и уязвимость к стрессу. 12. Социальный статус и стресс (иерархии). 13. Управление стрессом: что реально работает.","why":"Прямая биологическая база, которая напрямую пересекается с психиатрией (депрессия, тревожные расстройства, ПТСР).","give":"Понимание механизма, который будешь снова видеть в физиологии и психиатрии — не изолированный научпоп, а реальный фундамент."},
{"t":"Теории личности","a":"Ларри Хьелл, Дэниел Зиглер","group":"have","cat":"psych-gen","badge":"Трек Б","toc":"1. Введение: что такое теория личности, критерии оценки теорий. 2. Психодинамическое направление: Фрейд (структура личности, психосексуальные стадии, защитные механизмы). 3. Аналитическая психология Юнга: архетипы, коллективное бессознательное. 4. Индивидуальная психология Адлера: комплекс неполноценности, стиль жизни. 5. Эго-психология: Эриксон, стадии психосоциального развития. 6. Диспозициональное направление: Олпорт (черты личности), Кеттелл (факторный анализ), Айзенк (типы). 7. Бихевиористское направление: Скиннер, оперантное обусловливание. 8. Теория социального научения: Бандура, самоэффективность. 9. Когнитивное направление: Келли, теория личностных конструктов. 10. Гуманистическое направление: Маслоу (иерархия потребностей, самоактуализация), Роджерс (Я-концепция, клиент-центрированный подход). 11. Экзистенциальная психология: Мэй, Франкл. 12. Сравнение теорий и практическое применение.","why":"Сравнительный обзор основных теоретических рамок понимания личности.","give":"База для будущего психотерапевтического образования — понимание, из какой теории растёт каждая терапевтическая школа."},
{"t":"Когнитивная психология","a":"Роберт Солсо","group":"have","cat":"psych-gen","badge":"Трек Б","toc":"1. Введение и история когнитивной психологии. 2. Нейрокогнитивные основы познания. 3. Восприятие: теории распознавания образов. 4. Внимание: селективное внимание, модели фильтрации. 5. Память: сенсорная, кратковременная, рабочая память. 6. Долговременная память: эпизодическая, семантическая, процедурная. 7. Забывание и искажения памяти. 8. Репрезентация знаний: понятия, категории, схемы. 9. Зрительные образы (мысленные представления). 10. Язык: понимание и порождение речи. 11. Решение задач и творческое мышление. 12. Принятие решений и рассуждение. 13. Человеческий и искусственный интеллект.","why":"Более современный и структурированный, экспериментально обоснованный взгляд, чем классические советские учебники.","give":"Читать после базовых вводных текстов (Гиппенрейтер) — даёт более строгую, современную картину когнитивных процессов."},
{"t":"Детская психиатрия, психотерапия и медицинская психология","a":"","group":"have","cat":"psy","badge":"Издание требует уточнения","toc":"<p>Автор, редактор и год пока не указаны. Надёжно установить конкретную книгу и её оглавление по одному названию нельзя. Прежний список общих тем удалён: он не был подтверждён источником. Для заполнения нужен автор или редактор и год либо ISBN.</p>","why":"Книга внесена в твою библиотеку под этим названием. Библиографические данные ещё не установлены, поэтому содержание и адресат конкретного издания пока не описаны.","give":"После уточнения издания сюда можно добавить описание, реальную структуру и ссылку на издательский источник."},
{"t":"Психология эмоций","a":"Пол Экман","group":"have","cat":"popsci","badge":"Можно читать когда угодно","toc":"1. Что такое эмоция: определение, компоненты. 2. Универсальность базовых эмоций (гнев, страх, отвращение, удивление, радость, печаль) — кросс-культурные исследования. 3. Мимическое выражение эмоций: система кодирования лицевых движений (FACS). 4. Микровыражения и обнаружение скрываемых эмоций. 5. Гнев: триггеры, физиология, управление. 6. Страх и связанные состояния (тревога). 7. Отвращение и его эволюционная функция. 8. Печаль и горе. 9. Удивление как самая короткая эмоция. 10. Обман: как распознать ложь по невербальным сигналам. 11. Эмоциональная осознанность и регуляция эмоций.","why":"Исследования базовых эмоций и их универсальных выражений на лице.","give":"Общая эрудиция, смежная тема с эмоциональной регуляцией в психиатрии. Лёгкое чтение без предварительной базы."},
{"t":"Биология добра и зла","a":"Роберт Сапольски","group":"have","cat":"popsci","badge":"Не для тяжёлых эмоциональных периодов","toc":"1. Введение: поведение как результат множества причинных уровней. 2. За секунду до: нейробиология поступка (миндалина, префронтальная кора). 3. За секунды-минуты до: гормоны и поведение (тестостерон, окситоцин). 4. За часы-дни до: пренатальное развитие и раннее детство. 5. За годы до: подростковый мозг и его созревание. 6. За века до: генетика поведения. 7. За тысячелетия до: эволюция сотрудничества и агрессии. 8. Культура и экология: как среда формирует моральные нормы. 9. Мы и Они: нейробиология групповой идентичности и предвзятости. 10. Иерархия, статус и стресс в социальных группах. 11. Эмпатия, альтруизм и просоциальное поведение. 12. Мораль: интуиция vs рассуждение. 13. Война и мир: биология межгруппового насилия. 14. Свобода воли и вопрос ответственности с точки зрения детерминизма. 15. Заключение: что делать с этим знанием.","why":"Общие биологические основы поведения — агрессия, мораль, групповое поведение — через нейробиологию, эндокринологию, эволюцию.","give":"Более общий контекст, чем 'Психология стресса', меньше прямой связи с психиатрией. Содержит тяжёлые темы (геноцид, жестокость) — не читать в эмоционально тяжёлые периоды."},
{"t":"Думай медленно… Решай быстро","a":"Даниэль Канеман","group":"have","cat":"popsci","badge":"Общая эрудиция","toc":"1. Две системы мышления: Система 1 (быстрая, интуитивная) и Система 2 (медленная, аналитическая). 2. Эвристики и предвзятости: доступность, репрезентативность, привязка (anchoring). 3. Сверхуверенность и иллюзия понимания. 4. Эвристика узнавания и субституция. 5. Теория перспектив: как люди оценивают риск и выгоду. 6. Эффект фрейминга: влияние формулировки на решение. 7. Неприятие потерь (loss aversion). 8. Эффект владения (endowment effect). 9. Ментальный учёт (mental accounting). 10. Прогнозирование и регрессия к среднему. 11. Два Я: испытывающее и помнящее (experiencing vs remembering self). 12. Счастье и благополучие с точки зрения двух систем.","why":"Классика по когнитивным искажениям и процессу принятия решений.","give":"Общая эрудиция, не привязана к специальности напрямую. Полезный кругозор."},
{"t":"Когнитивно-поведенческая терапия","a":"Джудит Бек","group":"have","cat":"psychotherapy","badge":"Терапевтическая школа №1","toc":"1. Введение в когнитивно-поведенческую терапию и её теоретическая база. 2. Когнитивная концептуализация случая. 3. Структура первой сессии. 4. Структура последующих сессий. 5. Активация поведения и постановка целей. 6. Выявление автоматических мыслей. 7. Выявление эмоций и их связь с мыслями. 8. Оценка и ответ на автоматические мысли (когнитивная реструктуризация). 9. Выявление промежуточных убеждений (правила, установки). 10. Изменение промежуточных убеждений. 11. Выявление и изменение глубинных (core) убеждений. 12. Дополнительные когнитивные и поведенческие техники. 13. Домашние задания в терапии. 14. Завершение терапии и профилактика рецидива. 15. Проблемы в терапии и работа с сопротивлением.","why":"Одна из основных доказательных школ психотерапии, конкретные техники работы с искажённым мышлением.","give":"Прикладная клиническая книга — актуальна ближе к этапу реального психотерапевтического обучения, не сейчас."},
{"t":"Общая психопатология (1 том)","a":"Карл Ясперс","group":"have","cat":"psy","badge":"Феноменология и понимание","toc":"<p>Структура тома I по Hopkins Press; русский двухтомник КоЛибри 2025 года также завершает том перед частью III. Русские названия ниже — краткий перевод структуры, а не дословное оглавление твоего экземпляра.</p><p class=\"toc-part\">I. Отдельные явления психической жизни</p><ol start=\"1\"><li>Субъективные переживания при психических нарушениях</li><li>Объективно исследуемые психические функции</li><li>Телесные проявления и последствия психической деятельности</li><li>Смысловые проявления в объективных данных</li></ol><p class=\"toc-part\">II. Смысловые связи психической жизни</p><ol start=\"5\"><li>Понимание связей переживаний</li><li>Связи переживаний и их особые механизмы</li><li>Отношение пациента к заболеванию</li><li>Совокупность смысловых связей</li></ol><p>Введение и авторские предисловия. <a href=\"https://press.jhu.edu/books/title/16451/general-psychopathology\" target=\"_blank\" rel=\"noopener noreferrer\">Источник и полное оглавление</a>; <a href=\"https://azbooka.ru/books/obschaya-psikhopatologiya-ot-osnov-psikhopatologii-do-stanovleniya-lichnosti\" target=\"_blank\" rel=\"noopener noreferrer\">Русский том: издатель и фрагмент</a>.</p>","why":"Классический труд о методах психопатологии. Первый том описывает субъективные переживания, объективные проявления и телесные признаки, затем рассматривает понимание смысловых связей. Ясперс различает описание, понимание и причинное объяснение. Книга впервые вышла в 1913 году и многократно перерабатывалась; современные переводы отражают позднюю редакцию.","give":"Полезен для разбора понятий и методов клинического описания. Историческую классификацию нужно читать в контексте времени и сопоставлять с современными руководствами."},
{"t":"Общая психопатология (2 том)","a":"Карл Ясперс","group":"have","cat":"psy","badge":"Объяснение, целостность, общество","toc":"<p>Структура тома II по Hopkins Press; русский двухтомник КоЛибри 2025 года начинается с части III. Названия ниже сокращены и переведены для навигации; это не подтверждение издания твоего экземпляра.</p><p class=\"toc-part\">III. Причинные связи психической жизни</p><ol start=\"9\"><li>Воздействие тела и окружающей среды</li><li>Наследственные факторы</li><li>Значение объясняющих теорий</li></ol><p class=\"toc-part\">IV. Психическая жизнь в целом</p><ol start=\"12\"><li>Объединение признаков в болезненные формы</li><li>Человеческий род</li><li>Биографический подход</li></ol><p class=\"toc-part\">V. Нарушенная психическая жизнь в обществе и истории</p><p class=\"toc-part\">VI. Человек как целое</p><p>Приложение: обследование, задачи терапии, прогноз и история психопатологии. Именной и предметный указатели.</p><p><a href=\"https://www.press.jhu.edu/books/title/16452/general-psychopathology\" target=\"_blank\" rel=\"noopener noreferrer\">Источник и полное оглавление</a>; <a href=\"https://azbooka.ru/books/obschaya-psikhopatologiya-ot-stanovleniya-lichnosti-do-psikhologii-mass\" target=\"_blank\" rel=\"noopener noreferrer\">Русский том: издатель и фрагмент</a>.</p>","why":"Продолжение труда: причинное объяснение психических нарушений, построение целостной картины болезни, биография человека, социальные и исторические условия. Завершается обсуждением границ психопатологического знания и человека как целого.","give":"Продолжает методологию первого тома. Помогает различать отдельные симптомы, развитие болезни и жизненную историю; исторические концепции не следует автоматически принимать за современные диагностические правила."},
{"t":"Введение в общую психологию","a":"Гиппенрейтер Ю. Б.","group":"have","cat":"psych-gen","badge":"Трек Б, входная точка","toc":"<p>Курс из 16 лекций в трёх разделах (редакция второго издания, 1996). Темы лекций сокращены; это вводный курс, а не последовательный обзор всех психических процессов.</p><p class=\"toc-part\">I. Предмет психологии и история подходов</p><ol start=\"1\"><li>Психология как научная дисциплина</li><li>Учения о душе и исследование сознания</li><li>Интроспекция и самонаблюдение</li><li>Поведение как предмет исследования</li><li>Неосознаваемые механизмы действий</li><li>Бессознательное и его исследование</li></ol><p class=\"toc-part\">II. Материалистический подход к психике</p><ol start=\"7\"><li>Структура деятельности: действия и операции</li><li>Деятельность, мотивы и личность</li><li>Организация движения и сенсорные коррекции</li><li>Навыки движения и принцип активности</li><li>Эволюционное развитие психики</li><li>Социальная история психики и развитие ребёнка</li><li>Соотношение психического и физического</li></ol><p class=\"toc-part\">III. Индивидуальность и личность</p><ol start=\"14\"><li>Способности и типы темперамента</li><li>Понятие характера</li><li>Становление личности и самосознания</li></ol><p>Приложение: план семинаров; литература. <a href=\"https://spravochnick.ru/lektoriy/vvedenie-v-obschuyu-psihologiyun0lhu/\" target=\"_blank\" rel=\"noopener noreferrer\">Структура курса в библиографическом источнике</a>; <a href=\"https://ast.ru/book/vvedenie-v-obshchuyu-psikhologiyu-867357/\" target=\"_blank\" rel=\"noopener noreferrer\">Издатель и ознакомительный фрагмент</a>.</p>","why":"Вводный университетский курс Юлии Гиппенрейтер, выросший из лекций для первокурсников МГУ. Связывает историю представлений о психике с теорией деятельности, физиологией активности, эволюцией и социальным развитием психики, затем переходит к способностям, темпераменту, характеру и личности. Примеры из экспериментов и повседневной жизни поясняют основные понятия.","give":"База для будущего психотерапевтического образования, не для медицины напрямую. Хорошая входная точка в академическую психологию."},
{"t":"Дар психотерапии","a":"Ирвин Ялом","group":"have","cat":"nonfiction","badge":"Уже читаешь","toc":"Около 85 коротких глав-советов (это темы, а не дословные названия глав): выстраивание отношений с пациентом; эмпатия и присутствие; работа «здесь и сейчас»; перенос и контрперенос; самораскрытие терапевта; работа со сновидениями; тревога смерти и смысл жизни; сопротивление и трудные пациенты; ошибки и границы терапевта; забота терапевта о себе; завершение терапии.","why":"Короткие главы-размышления о практике психотерапии от практикующего психиатра.","give":"Интуиция про терапевтические отношения в целом, независимо от школы. Идеально для вечернего чтения."},
{"t":"Лжец на кушетке","a":"Ирвин Ялом","group":"have","cat":"fiction","badge":"Художественная проза, не рабочий трек","toc":"Это роман, а не сборник глав, поэтому оглавления в привычном смысле нет. Сюжет строится вокруг двух психотерапевтов с противоположным отношением к профессиональной этике: один старается быть честным с пациентами, другой манипулирует ими. Повествование чередует терапевтические сеансы и профессиональные интриги, главы короткие и читаются как отдельные сцены.","why":"Беллетристика, использующая психотерапию как материал для сюжета.","give":"Хорошая литература для удовольствия — не двигает к цели, но и не вредит. Читать отдельно от рабочего списка."},
{"t":"Палач любви","a":"Ирвин Ялом","group":"have","cat":"nonfiction","badge":"Продолжение Дара психотерапии","toc":"<p>Эксмо / БОМБОРА, 2019, ISBN 978-5-04-100227-5. Пролог и десять терапевтических историй; ниже краткие обозначения глав, точные заголовки — в PDF издателя. Названия сокращены для навигации.</p><ol start=\"1\"><li>Терапия любовной одержимости</li><li>Фантазия о разрешённом насилии</li><li>Утрата ребёнка и горе</li><li>История пациентки с ожирением</li><li>Неожиданная личная беда</li><li>Призыв перестать красться</li><li>История о двух улыбках</li><li>История трёх закрытых писем</li><li>Исключительность отношений в терапии</li><li>Поиск того, кто видит сны</li></ol><p><a href=\"https://cdn.eksmo.ru/v2/ITD000000000948923/PDF/ITD000000000948923_TOC.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Точные заголовки всех глав (официальный PDF)</a></p><p>Послесловие: автор возвращается к книге в восьмидесятилетнем возрасте.</p>","why":"Десять историй психотерапии, в которых Ялом рассматривает любовь, утрату, одиночество, страх смерти и отношения пациента с терапевтом. Автор показывает не только переживания пациентов, но и собственные реакции, сомнения и решения. Книга построена как клиническое повествование, а не как систематический учебник терапии.","give":"Материал для обсуждения терапевтических отношений и профессиональной рефлексии. Описания случаев не заменяют обучение методу и супервизию."},
{"t":"Человек, который принял жену за шляпу","a":"Оливер Сакс","group":"have","cat":"nonfiction","badge":"Уже читаешь","toc":"Четыре части (проверь нумерацию в своём издании). I. Потери: «Человек, который принял жену за шляпу», «Потерянный мореход», «Бестелесная Кристина», «Человек, выпавший из кровати», «Руки», «Фантомы», «На ровном месте», «Смотреть направо!», «Речь президента». II. Излишки: «Дело тождества», «Да, отец-сестра», «Одержимая», «Остроумный тикующий Рэй», «Болезнь Купидона». III. Переносы: «Собака под кожей», «Реминисценция», «Вечная ностальгия», «Путешествие в Индию», «Убийство», «Проблеск видения». IV. Мир простых: «Ребекка», «Ходячее чудо», «Близнецы», «Художник-аутист». Названия даны по памяти в русском переводе и могут отличаться в твоём издании.","why":"Реальные клинические случаи неврологических пациентов, поданные с сочувствием.","give":"Лёгкий, увлекательный вход в нейропсихиатрию, не требует подготовки."},
{"t":"Пробуждения","a":"Оливер Сакс","group":"have","cat":"nonfiction","badge":"Продолжение цикла Сакса","toc":"<p>Расширенная англоязычная редакция 1990 года, Vintage 1999, ISBN 9780375704055. Русские обозначения сокращены; состав дополнений зависит от редакции.</p><p class=\"toc-part\">Пролог</p><ol start=\"1\"><li>Болезнь Паркинсона и паркинсонизм</li><li>Летаргический энцефалит</li><li>Последствия эпидемии, 1927–1967</li><li>Жизнь в Mount Carmel</li><li>Появление L-DOPA</li></ol><p class=\"toc-part\">Пробуждения: 20 историй пациентов</p><p>Фрэнсис D., Магда B., Роуз R., Роберт O., Хестер Y., Роландо P., Мириам H., Люси K., Маргарет A., Майрон V., Герти C., Марта N., Ида T., Фрэнк G., Мария G., Рэйчел I., Аарон E., Джордж W., Сесил M., Леонард L.</p><p class=\"toc-part\">Перспективы</p><ol start=\"1\"><li>Общая перспектива</li><li>Пробуждение</li><li>Испытания</li><li>Приспособление</li></ol><p>Эпилог 1982 года; дополнение 1990 года. Приложения: история энцефалита, «чудесные» лекарства, электрические механизмы пробуждения, лечение после L-DOPA, пространство и время при паркинсонизме, хаос, сценические и экранные версии. Глоссарий, библиография, указатель.</p><p><a href=\"https://edisonohio.ecampus.com/awakenings-1st-sacks-oliver/bk/9780375704055\" target=\"_blank\" rel=\"noopener noreferrer\">Оглавление указанной редакции</a>; <a href=\"https://ast.ru/book/probuzhdeniya-834707/\" target=\"_blank\" rel=\"noopener noreferrer\">Русское издание АСТ</a>.</p>","why":"Документальные истории людей с последствиями летаргического энцефалита, которых Сакс наблюдал в больнице Mount Carmel. Описаны их жизнь до применения леводопы, изменения на фоне лечения, последующие трудности и попытки приспособиться. Медицинское наблюдение соединяется с вниманием к биографии и переживаниям человека.","give":"Тот же формат, что уже прочитанные книги Сакса — доступно, клинически, эмоционально."},
{"t":"Галлюцинации","a":"Оливер Сакс","group":"have","cat":"nonfiction","badge":"Уже читаешь","toc":"<p>Hallucinations, Knopf, 2012: 15 глав. Русские обозначения передают содержание заголовков английского оглавления; перевод АСТ может называть их иначе. Названия сокращены для навигации.</p><ol start=\"1\"><li>Синдром Шарля Бонне</li><li>Зрительные образы при сенсорной депривации</li><li>Обонятельные обманы восприятия</li><li>Слуховые обманы восприятия</li><li>Обманы восприятия при паркинсонизме</li><li>Изменённые состояния сознания</li><li>Зрительные феномены мигрени</li><li>Эпилептические переживания</li><li>Галлюцинации в половине поля зрения</li><li>Переживания при делирии</li><li>Образы у границы сна</li><li>Нарколепсия и ночные пугающие образы</li><li>Преследующие образы в психической жизни</li><li>Восприятие собственного двойника</li><li>Фантомы и ощущение присутствия</li></ol><p><a href=\"https://openlibrary.org/books/OL25190272M/Hallucinations\" target=\"_blank\" rel=\"noopener noreferrer\">Библиографическая запись с оглавлением</a></p><p><a href=\"https://ast.ru/book/gallyutsinatsii-847734/\" target=\"_blank\" rel=\"noopener noreferrer\">Русский перевод: АСТ</a>.</p>","why":"Неврологическое исследование галлюцинаторных переживаний через истории пациентов, наблюдения автора и исторические примеры. Главы охватывают разные модальности восприятия и контексты: потерю зрения, сенсорную депривацию, мигрень, эпилепсию, сон и другие состояния. Это повествование о разнообразии опыта, а не диагностический справочник.","give":"Продолжение темы восприятия и мозга в доступном формате."},
{"t":"Музыкофилия","a":"Оливер Сакс","group":"have","cat":"nonfiction","badge":"Расширение цикла Сакса","toc":"<p>Musicophilia, Vintage, 2008, ISBN 9781400033539: 29 глав. Названия кратко переведены с английского оглавления.</p><p class=\"toc-part\">I. Музыка преследует</p><ol start=\"1\"><li>Внезапная страсть к музыке</li><li>Музыкальные эпилептические переживания</li><li>Музыкогенная эпилепсия</li><li>Музыкальные образы и воображение</li><li>Навязчивые мелодии</li><li>Музыкальные галлюцинации</li></ol><p class=\"toc-part\">II. Разнообразие музыкальности</p><ol start=\"7\"><li>Диапазон музыкальных способностей</li><li>Амузия и дисгармония</li><li>Абсолютный слух</li><li>Кохлеарная амузия</li><li>Стереослух и два уха</li><li>Музыкальные саванты</li><li>Музыка и слепота</li><li>Музыкальная синестезия</li></ol><p class=\"toc-part\">III. Память, движение, музыка</p><ol start=\"15\"><li>Музыка при амнезии</li><li>Афазия, речь и пение</li><li>Дискинезия и напевная речь</li><li>Музыка при синдроме Туретта</li><li>Ритм и движение</li><li>Паркинсонизм и музыкотерапия</li><li>Фантомные пальцы пианиста</li><li>Дистония музыкантов</li></ol><p class=\"toc-part\">IV. Эмоции и идентичность</p><ol start=\"23\"><li>Музыкальные сновидения</li><li>Притяжение музыки и безразличие</li><li>Музыка при депрессии</li><li>Гарри S.: музыка и чувства</li><li>Височные доли и неудержимая музыкальность</li><li>Синдром Вильямса</li><li>Музыка при деменции</li></ol><p>Предисловие, благодарности, библиография, указатель. <a href=\"https://www.barnesandnoble.com/w/musicophilia-oliver-w-sacks/1102555193\" target=\"_blank\" rel=\"noopener noreferrer\">Оглавление указанной редакции</a>.</p>","why":"Сакс исследует связь музыки с восприятием, памятью, движением и эмоциональной жизнью. Истории необычной музыкальности и нарушений слухового опыта соседствуют с наблюдениями о музыке при неврологических заболеваниях. Структура ведёт от непроизвольных музыкальных переживаний к способностям, памяти, моторике и идентичности.","give":"Тот же проверенный формат — доступно и по теме."},
{"t":"Мышление и речь","a":"Лев Выготский","group":"have","cat":"psych-gen","badge":"Трек Б, пара с Лурией","toc":"1. Проблема и метод исследования. 2. Проблема речи и мышления ребёнка в учении Ж. Пиаже (эгоцентрическая речь). 3. Проблема речи и мышления в учении В. Штерна. 4. Генетические корни мышления и речи (доинтеллектуальная речь, доречевое мышление, их пересечение). 5. Экспериментальное исследование развития понятий (метод двойной стимуляции, стадии образования понятий). 6. Исследование развития научных понятий в детском возрасте (обучение и развитие, зона ближайшего развития). 7. Мысль и слово (внутренняя речь, значение слова, мотивация мысли).","why":"Теория связи развития мышления и речи, культурно-историческая концепция.","give":"Классика психологии развития, база для понимания школы Лурии. Плотный теоретический текст — читать рядом с 'Лекциями по общей психологии' Лурии."},
{"t":"С ума сойти","a":"Дарья Варламова, Антон Зайниев","group":"have","cat":"popsci","badge":"Популярный русскоязычный обзор","toc":"<p>Издательский фрагмент Альпины: 11 глав. Названия сокращены; старый тематический список не отражал действительное оглавление. Названия сокращены для навигации.</p><ol start=\"1\"><li>Происхождение расстройств и границы нормы</li><li>Депрессивные расстройства</li><li>Биполярные колебания настроения</li><li>Тревожные расстройства</li><li>Ритуалы и обсессивно-компульсивное расстройство</li><li>Дефицит внимания</li><li>Аутизм: глава о синдроме Аспергера</li><li>Шизофрения</li><li>Антисоциальное расстройство личности</li><li>Пограничное расстройство личности</li><li>Обращение за психиатрической помощью</li></ol><p><a href=\"https://alpinabook.ru/upload/iblock/45f/ynw2b9eomanwox6dgntjbstz6bek20y0/Листалка.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Полное оглавление в официальном фрагменте (PDF)</a></p>","why":"Русскоязычный научно-популярный путеводитель по психическим расстройствам и обращению за помощью. Объясняет различие нормы и патологии, затем рассматривает депрессию, биполярное расстройство, тревогу, ОКР, СДВГ, аутизм, шизофрению и два расстройства личности. Завершается практической главой о помощи. Терминология и сведения отражают время издания.","give":"Доступный вход в тему на русском, написан для широкой аудитории — не заменяет клинические учебники, но хорош для ориентации сейчас."},
{"t":"Психология влияния","a":"Роберт Чалдини","group":"have","cat":"popsci","badge":"Общая эрудиция","toc":"1. Оружие влияния (автоматические реакции, «щёлк-жжж»). 2. Взаимный обмен (правило взаимности, уступки и «отказ-затем-отступление»). 3. Приверженность и последовательность (маленькие шаги, письменные обязательства). 4. Социальное доказательство (следование за толпой, эффект свидетеля). 5. Благорасположение (привлекательность, сходство, комплименты, ассоциации). 6. Авторитет (символы и титулы, эксперимент Милгрэма). 7. Дефицит (ограниченность предложения и ограниченность времени). 8. Мгновенное влияние (как защищаться от автоматических триггеров). Названия глав даны по памяти и могут слегка отличаться в издании.","why":"Шесть принципов социального влияния и убеждения.","give":"Общий кругозор по социальной психологии — частично дублируется/расширяется книгой Майерса."},
{"t":"Я вижу, о чем вы думаете","a":"Джо Наварро","group":"have","cat":"popsci","badge":"Развлекательно-прикладное","toc":"<p>What Every BODY Is Saying, HarperCollins, 2008, ISBN 9780061438295: 9 глав. Обозначения кратко переведены с английского оглавления. Названия сокращены для навигации.</p><ol start=\"1\"><li>Освоение невербального общения</li><li>Лимбические реакции</li><li>Сигналы ног и стоп</li><li>Сигналы туловища, таза, груди и плеч</li><li>Сигналы рук</li><li>Сигналы кистей и пальцев</li><li>Сигналы лица</li><li>Осторожность при распознавании обмана</li><li>Заключительные размышления</li></ol><p><a href=\"https://openlibrary.org/books/OL19904132M/What_every_BODY_is_saying\" target=\"_blank\" rel=\"noopener noreferrer\">Библиографическая запись с оглавлением</a></p><p>Предисловие Марвина Карлинса, благодарности, библиография, указатель.</p>","why":"Практическая книга Джо Наварро и Марвина Карлинса о наблюдении за невербальным поведением. После вводных принципов авторы переходят от ног и туловища к рукам, кистям и лицу. Отдельная глава посвящена ограничениям распознавания обмана. Книгу полезно читать как набор наблюдений для обсуждения, а не как систему безошибочного определения мыслей.","give":"Легковесное чтение, полезная бытовая эрудиция, не клинический инструмент — не путать с реальной диагностической наблюдательностью психиатра."},
{"t":"Биполярное расстройство","a":"Светлана Бозрова","group":"have","cat":"psy","toc":"<p>АСТ, 2025, ISBN 978-5-17-168679-6. Подтверждённая часть оглавления ознакомительного фрагмента:</p><p class=\"toc-part\">Фаза 1. Депрессия</p><ol start=\"1\"><li>Мечты о будущем</li><li>Сожаление и страх</li><li>Стажировка</li><li>Возвращение домой</li></ol><p>Это начало книги, а не полное оглавление: остальные названия не опубликованы в доступном фрагменте. <a href=\"https://cdn.ast.ru/v2/ASE000000000880778/read/full?logo_type=ast\" target=\"_blank\" rel=\"noopener noreferrer\">Официальный фрагмент АСТ</a>.</p>","why":"Автобиографическая книга о жизни с биполярным аффективным расстройством II типа. Светлана Бозрова, биолог и научный редактор, рассказывает об опыте депрессивных и гипоманиакальных эпизодов, диагностике, лечении и поиске устойчивости в повседневной жизни, о влиянии болезни на учёбу, работу, отношения и восприятие себя. Полное название — «Биполярное расстройство. Моя реальность» (АСТ, 256 с.). В отличие от клинических руководств, показывает расстройство глазами человека, который с ним живёт.","give":"Взгляд изнутри: как расстройство переживается, а не как диагностируется. Дополняет клиническое описание в Oxford (глава 10 «Биполярное расстройство»). Это опыт одного человека, а не обзор."},
{"t":"Аутизм у взрослых","a":"Зоя Соколова","group":"have","cat":"psy","toc":"<p>Эксмо / БОМБОРА, ISBN 978-5-04-228735-0: 40 глав. Ниже сокращённая навигация; точные заголовки и страницы доступны в издательском PDF.</p><p class=\"toc-part\">I. Клинический взгляд на РАС</p><ol start=\"1\"><li>История изучения аутизма</li><li>Основные понятия</li><li>Особенности мозга при РАС</li><li>Объяснения возникновения РАС</li><li>Критерии постановки диагноза</li><li>Мифы и ошибки</li><li>Разграничение с другими состояниями</li><li>Сопутствующие состояния</li><li>Сочетание с СДВГ</li><li>Переживание травмы</li><li>Особенности питания</li><li>Самостоятельное распознавание РАС</li><li>Диагностический процесс</li><li>Терапия взрослых с РАС</li></ol><p class=\"toc-part\">II. Нейроразнообразие и аутичный опыт</p><ol start=\"15\"><li>Нейроразнообразие как подход</li><li>Расширенный аутичный фенотип</li><li>Общение и взаимодействие</li><li>Повторяющиеся формы поведения</li><li>Стимминг как саморегуляция</li><li>Особые интересы</li><li>Инертность и негибкость мышления</li><li>Сенсорные особенности</li><li>Состояния перегрузки</li><li>Проявления РАС у женщин</li><li>Маскировка особенностей</li><li>Выгорание при аутизме</li><li>Трудности с эмоциями</li><li>Дезадаптивное фантазирование</li><li>Савантные способности</li><li>Избегание предъявляемых требований</li></ol><p class=\"toc-part\">III. Повседневная жизнь</p><ol start=\"31\"><li>Проблемы сна</li><li>Движение и здоровье</li><li>Учёба и необходимая поддержка</li><li>Трудоустройство и работа</li><li>Партнёрские отношения</li><li>Сексуальная жизнь</li><li>Дружеские отношения</li><li>Беременность и воспитание детей</li><li>Пожилой возраст</li><li>Трудности и качество жизни</li></ol><p>Заключение. Руководство для психологов: концептуализация, диагностика, среда, психообразование, перегрузка, маскировка, идентичность, ценности и выгорание. Библиография; указатель. <a href=\"https://cdn.eksmo.ru/v2/ITD000000001461973/PDF/ITD000000001461973_TOC.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Точные заголовки и страницы (официальный PDF)</a>.</p>","why":"Научно-популярная книга клинического психолога Зои Соколовой об аутизме у взрослых без выраженных нарушений речи и интеллекта. Рассматривает современные диагностические критерии, особенности сенсорного восприятия, коммуникации, социального взаимодействия и эмоциональной регуляции; отдельно — аутизм у женщин, маскировка, поздняя диагностика, работа, дружба, близкие отношения и родительство. Сочетает обзор исследований с личным опытом аутичных людей. Полное название — «Аутизм у взрослых. Как он проявляется, зачем его диагностировать и что предпринять, чтобы стало жить легче» (Эксмо).","give":"Практическая сторона аутизма во взрослом возрасте, с материалами для специалистов; читается рядом с «Искателями закономерностей» Барон-Коэна — та же тема с научной стороны."},
{"t":"Искатели закономерностей","a":"Саймон Барон-Коэн","group":"have","cat":"popsci","toc":"9 глав. 1. Прирождённые искатели закономерностей 2. Механизм систематизации 3. Пять типов мозга 4. Ум изобретателя 5. Революция в мозге 6. Системная слепота: почему обезьяны не катаются на скейтборде 7. Битва гигантов 8. Секс в Долине 9. Забота об изобретателях будущего","why":"Британский психолог и исследователь аутизма Саймон Барон-Коэн связывает человеческую изобретательность со способностью распознавать закономерности и систематизировать информацию. Рассматривает когнитивные механизмы, позволяющие выявлять причинно-следственные связи и создавать технологии, систематизирующее мышление у аутичных людей, индивидуальные различия и эволюционные предпосылки изобретательности; опирается на психологию, нейронауку, археологию и исследования аутизма. Полное название — «Искатели закономерностей. Как аутизм способствует человеческой изобретательности» (Альпина нон-фикшн, 2023).","give":"Научный взгляд на аутизм как на особенность мышления. Это теория одного автора, а не общепринятый факт, поэтому читать критически."},
{"t":"Анатомия Неттера: атлас-раскраска. 2-е издание","a":"Джон Т. Хансен","group":"have","cat":"anatomy","badge":"Активное обучение","toc":"1. Остеология: череп, позвоночник, грудная клетка, кости конечностей. 2. Артрология: суставы и их типы. 3. Мышечная система по регионам: голова/шея, спина, грудь, живот, конечности. 4. Сердечно-сосудистая система: сердце, крупные сосуды, артерии и вены по регионам. 5. Лимфатическая система. 6. Нервная система: ЦНС (мозг, спинной мозг), ПНС (сплетения, периферические нервы), черепные нервы. 7. Дыхательная система: полость носа, гортань, трахея, лёгкие. 8. Пищеварительная система: от полости рта до толстого кишечника, печень, поджелудочная. 9. Мочевыделительная система. 10. Половая система (мужская и женская). 11. Эндокринная система: железы и их расположение. 12. Органы чувств: глаз, ухо. Каждая тема — разворот с контуром для раскрашивания и списком структур для подписи.","why":"Активное действие (раскрашивание) задействует моторную память в дополнение к зрительной — научно обоснованный метод.","give":"Мощная комбинация с Roosalu/Lepp: читаешь тему → закрепляешь раскраской. Использовать параллельно с систематическим изучением анатомии, не раньше."},
{"t":"Textbook of Medical Physiology (1st part)","a":"Guyton and Hall","group":"have","cat":"medbase","badge":"Фундамент медицины","toc":"Часть 1: 1. Клетка и общая физиология. 2. Мембранная физиология, нервы, мышцы. 3. Сердце. 4. Кровообращение. 5. Почки и жидкости тела. 6. Кровь, иммунитет, свёртывание. 7. Дыхание. Часть 2: 8. Физиология нервной системы (общая, специальные чувства). 9. Моторная и интегративная нейрофизиология (включая лимбическую систему, сон, мотивацию). 10. ЖКТ физиология. 11. Метаболизм и терморегуляция. 12. Эндокринология и репродукция. 13. Спортивная физиология.","why":"Золотой стандарт учебника физиологии человека — как работают все системы организма.","give":"Фундамент для всей дальнейшей медицины, включая нейрофизиологию и эндокринологию стресса, критичных для психиатрии. Требует базовой химии/биологии — не спеши, дождись этой базы."},

{"t":"Inimese anatoomia. 1 osa","a":"Arne Lepp","group":"have","cat":"anatomy","badge":"Углублённый уровень","toc":"1. Sissejuhatus anatoomiasse (введение, анатомическая терминология). 2. Luustiku üldosa (общая остеология). 3. Kolju (череп): ajukolju, näokolju, kolju kui tervik. 4. Kere luud (кости туловища): selgroog, roided, rinnaku. 5. Ülajäseme luustik (кости верхней конечности). 6. Alajäseme luustik (кости нижней конечности). 7. Liigesteõpetus (артрология): kolju, kere, jäsemete liigesed. 8. Lihasteõpetus (миология): pea ja kaela lihased, kere lihased, jäsemete lihased.","why":"Более детальный и объёмный эстонский учебник анатомии.","give":"Основной, углублённый источник анатомических знаний на годы вперёд. Читать после Roosalu, не вместо него."},
{"t":"Inimese anatoomia. 2 osa","a":"Arne Lepp","group":"have","cat":"anatomy","badge":"Углублённый уровень","toc":"1. Seedeelundkond (пищеварительная система): suuõõs, neelu, söögitoru, magu, sooled, maks, kõhunääre. 2. Hingamiselundkond (дыхательная система): nina, kõri, hingetoru, kopsud. 3. Kuse-suguelundkond (мочеполовая система): neerud, kusejuhad, põis, sugunäärmed. 4. Südame-veresoonkond (сердечно-сосудистая система): süda, arterid, veenid, vereringed. 5. Lümfisüsteem (лимфатическая система). 6. Sisesekretsiooninäärmed (эндокринные железы). 7. Kesknärvisüsteem (ЦНС): seljaaju, ajutüvi, väikeaju, suuraju. 8. Perifeerne närvisüsteem (ПНС): kraniaalnärvid, seljaajunärvid, autonoomne närvisüsteem. 9. Meeleelundid (органы чувств).","why":"Вторая часть детального курса анатомии.","give":"Завершает систематический курс анатомии вместе с 1 osa."},
{"t":"Netter Atlas of Human Anatomy. Classic Regional Approach. 9th edition","a":"Frank H. Netter","group":"have","cat":"anatomy","badge":"Медицинский стандарт атласа","toc":"1. Голова и шея: череп, мозг, черепные нервы, лицо. 2. Позвоночник и спина. 3. Грудная клетка: сердце, лёгкие, средостение. 4. Живот: ЖКТ, печень, почки, забрюшинное пространство. 5. Таз и промежность. 6. Верхняя конечность: плечо, предплечье, кисть. 7. Нижняя конечность: бедро, голень, стопа. 8. Нейроанатомия отдельным разделом: спинной мозг, ствол, полушария. Каждый раздел содержит костные ориентиры, мышцы, сосуды, нервы послойно.","why":"Золотой стандарт медицинского анатомического атласа, используется в медвузах повсеместно.","give":"Апгрейд к уже имеющемуся Маккракену — точнее номенклатура, удобнее для быстрого поиска структуры. Справочник, не читается подряд."},
{"t":"Netter’s Anatomy Coloring Book. 4th edition","a":"John T. Hansen","group":"have","cat":"anatomy","badge":"Активное обучение","toc":"1. Остеология: череп, позвоночник, грудная клетка, кости конечностей. 2. Артрология: суставы и их типы. 3. Мышечная система по регионам: голова/шея, спина, грудь, живот, конечности. 4. Сердечно-сосудистая система: сердце, крупные сосуды, артерии и вены по регионам. 5. Лимфатическая система. 6. Нервная система: ЦНС (мозг, спинной мозг), ПНС (сплетения, периферические нервы), черепные нервы. 7. Дыхательная система: полость носа, гортань, трахея, лёгкие. 8. Пищеварительная система: от полости рта до толстого кишечника, печень, поджелудочная. 9. Мочевыделительная система. 10. Половая система (мужская и женская). 11. Эндокринная система: железы и их расположение. 12. Органы чувств: глаз, ухо. Каждая тема — разворот с контуром для раскрашивания и списком структур для подписи.","why":"Активное действие (раскрашивание) задействует моторную память в дополнение к зрительной — научно обоснованный метод.","give":"Мощная комбинация с Roosalu/Lepp: читаешь тему → закрепляешь раскраской. Использовать параллельно с систематическим изучением анатомии, не раньше."},

];

const CATS = {
psy:"Психиатрия", neuro:"Неврология/нейронаука", "psych-gen":"Общая психология",
popsci:"Научпоп", psychotherapy:"Психотерапия (школы)", nonfiction:"Клинич. нон-фикшн",
fiction:"Худож. проза", anatomy:"Анатомия", medbase:"Медицинская база"
};
const GROUPS = {
  have:{icon:"✅",label:"Having · 📚",hint:"Книги уже в библиотеке"},
  ru:{icon:"⏳",label:"Waiting · 🇷🇺 (11.26)",hint:"Ожидаются из России · 11.26"},
  eu:{icon:"⏳",label:"Waiting · 🇪🇺 (26/27)",hint:"Ожидаются из Европы · 26/27"}
};

const state = {group:null, cat:'all', q:''};
const $ = id => document.getElementById(id);

function plural(n,[one,few,many]){const m10=n%10,m100=n%100;return m10===1&&m100!==11?one:m10>=2&&m10<=4&&(m100<12||m100>14)?few:many;}
const books = n => n+' '+plural(n,['книга','книги','книг']);

// Нумерованное оглавление («1. … 2. …») показываем списком; вводный текст и «Часть N:» —
// отдельными строками. Если нумерация не идёт подряд, оставляем абзац как есть.
function numbered(t){
  const m = t.match(/(?<!Часть)(?:^|\s)(\d{1,2})\.\s/);
  if(!m) return null;
  const at = m.index + (m[0].length - m[0].trimStart().length);
  const items = t.slice(at).split(/(?<!Часть)\s(?=\d{1,2}\.\s)/);
  const nums = items.map(s=>+s.match(/^\d+/)[0]);
  if(items.length<3 || nums.some((n,k)=>n!==nums[0]+k)) return null;
  return {intro:t.slice(0,at).trim(), start:nums[0], items:items.map(s=>s.replace(/^\d{1,2}\.\s/,''))};
}
function tocHtml(t){
  if (/^\s*</.test(t)) return t; // готовая HTML-разметка
  return t.split(/\s(?=Часть \d+:\s)/).map(g=>{
    const part = g.match(/^Часть \d+:\s/);
    const n = numbered(part ? g.slice(part[0].length) : g);
    if(!n) return `<p>${g}</p>`;
    return (part?`<p class="toc-part">${part[0].replace(/:\s$/,'')}</p>`:'')
      + (n.intro?`<p class="toc-intro">${n.intro.replace(/:$/,'')}</p>`:'')
      + `<ol start="${n.start}">${n.items.map(i=>`<li>${i}</li>`).join('')}</ol>`;
  }).join('');
}

function matches(b, ignore){
  return (ignore==='group'||!state.group||b.group===state.group)
    && (ignore==='cat'||state.cat==='all'||b.cat===state.cat)
    && (!state.q||b.t.toLowerCase().includes(state.q)||b.a.toLowerCase().includes(state.q)||(b.aliases||[]).some(a=>a.toLowerCase().includes(state.q)));
}

function renderStatus(){
  $('status').innerHTML = Object.entries(GROUPS).map(([k,g])=>{
    const n = DATA.filter(b=>b.group===k && matches(b,'group')).length;
    return `<button class="s-${k}" data-group="${k}" aria-pressed="${state.group===k}"><span class="eyebrow">${g.icon} ${g.label}</span><strong>${n}</strong><small>${n?g.hint:'Пока пусто'}</small></button>`;
  }).join('');
}

function renderChips(){
  const all = DATA.filter(b=>matches(b,'cat')).length;
  let html = `<button data-cat="all" aria-pressed="${state.cat==='all'}">Все темы<span>${all}</span></button>`;
  for(const [c,label] of Object.entries(CATS)){
    const n = DATA.filter(b=>b.cat===c && matches(b,'cat')).length;
    html += `<button data-cat="${c}" aria-pressed="${state.cat===c}">${label}<span>${n}</span></button>`;
  }
  $('chips').innerHTML = html;
}

function bookHtml(b,i){
  const meta = `<span class="book-meta">${b.badge?`<span class="badge">${b.badge}</span>`:''}<span class="book-cat">${CATS[b.cat]}</span></span>`;
  const head = `<span class="book-title">${b.t}</span>${b.a?`<span class="book-author">${b.a}</span>`:''}${meta}`;
  if(!b.toc) return `<li class="book s-${b.group}"><div class="book-static">${head}<span class="no-info">Описание пока не добавлено</span></div></li>`;
  return `
    <li class="book s-${b.group}">
      <button class="book-head" aria-expanded="false" aria-controls="b${i}">
        <span>${head}</span>
        <span class="chev" aria-hidden="true">▾</span>
      </button>
      <div class="book-body" id="b${i}" hidden>
        <div><h3>Оглавление / основные темы</h3><div class="toc">${tocHtml(b.toc)}</div></div>
        <div class="book-why">
          <div><h3>Зачем эта книга</h3><p>${b.why}</p></div>
          <div><h3>Что она даёт лично тебе</h3><p>${b.give}</p></div>
        </div>
      </div>
    </li>`;
}

function renderList(){
  const list = DATA.map((b,i)=>[b,i]).filter(([b])=>matches(b));
  $('count').textContent = list.length===DATA.length ? `Все ${books(DATA.length)}` : `Показано: ${books(list.length)} из ${DATA.length}`;
  $('reset').hidden = !(state.group||state.cat!=='all'||state.q);
  if(!list.length){$('list').innerHTML = '<li class="lib-empty">Ничего не найдено. Попробуй сбросить фильтры.</li>';return;}
  $('list').innerHTML = Object.entries(GROUPS).map(([k,g])=>{
    const items = list.filter(([b])=>b.group===k);
    if(!items.length) return '';
    return `<li class="group-head"><h2 class="group-title">${g.icon} ${g.label}<small>${books(items.length)}</small></h2></li>`+items.map(([b,i])=>bookHtml(b,i)).join('');
  }).join('');
}

function render(){renderStatus();renderChips();renderList();}

$('status').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  state.group = state.group===btn.dataset.group ? null : btn.dataset.group;
  render(); $('status').querySelector('[data-group="'+btn.dataset.group+'"]').focus({preventScroll:true});
});
$('chips').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  state.cat = btn.dataset.cat; render(); $('chips').querySelector('[data-cat="'+state.cat+'"]').focus({preventScroll:true});
});
$('search').addEventListener('input', e=>{state.q = e.target.value.trim().toLowerCase(); render();});
$('reset').addEventListener('click', ()=>{state.group=null;state.cat='all';state.q='';$('search').value='';render();});
$('list').addEventListener('click', e=>{
  const head = e.target.closest('.book-head'); if(!head) return;
  const open = head.getAttribute('aria-expanded')!=='true';
  head.setAttribute('aria-expanded', open);
  $(head.getAttribute('aria-controls')).hidden = !open;
});

{const n=g=>DATA.filter(b=>b.group===g).length;$('lede').textContent = `${books(DATA.length)}: ${n('have')} в наличии, ${n('ru') + n('eu')} в ожидании. У книг с описанием есть оглавление, пояснение, зачем нужна, и что она даёт лично тебе.`;}
render();
</script>
